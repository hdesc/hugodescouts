<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Hugo Descouts</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cabinet+Grotesk:wght@300;400;500;700;800;900&family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
/* ─── TOKENS ─── */
:root{
  --cream:#F2EDE4;
  --ink:#0D0D0D;
  --red:#E8210A;
  --ink60:rgba(13,13,13,.6);
  --ink20:rgba(13,13,13,.12);
  --ink08:rgba(13,13,13,.08);
}

/* ─── RESET ─── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;background:var(--cream)}
body{background:var(--cream);color:var(--ink);font-family:'Cabinet Grotesk',sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
button{cursor:pointer;border:none;background:none;color:inherit;font-family:inherit}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--cream)}
::-webkit-scrollbar-thumb{background:var(--red);border-radius:2px}

/* ─── NOISE ─── */
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:998;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  opacity:.6;
}

/* ─── NAV ─── */
#nav{
  position:fixed;top:0;left:0;right:0;z-index:200;
  padding:clamp(1rem,2.5vw,1.8rem) clamp(1.5rem,4vw,3.5rem);
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
  transition:background .35s,border-color .35s;
}
#nav.scrolled{background:rgba(242,237,228,.96);backdrop-filter:blur(16px);border-bottom:1px solid var(--ink20)}
.nav-logo{
  font-family:'Bebas Neue',sans-serif;font-size:2rem;letter-spacing:.08em;
  color:var(--ink);line-height:1;user-select:none;
}
.nav-links{display:flex;gap:clamp(1.5rem,3vw,3rem);align-items:center}
.nav-links a{
  font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ink60);transition:color .2s;white-space:nowrap;
}
.nav-links a:hover{color:var(--ink)}
.hbg{display:none;color:var(--ink);font-size:1.4rem;padding:.25rem}

/* ─── MOBILE MENU ─── */
.mob{
  display:none;position:fixed;inset:0;background:var(--cream);z-index:300;
  flex-direction:column;justify-content:flex-end;
  padding:clamp(2.5rem,6vw,5rem);gap:1.5rem;
}
.mob.open{display:flex}
.mob a{
  font-family:'Bebas Neue',sans-serif;font-size:clamp(3rem,10vw,6rem);
  letter-spacing:.03em;color:var(--ink);line-height:1.1;border-bottom:1px solid var(--ink20);
  padding-bottom:.4rem;
}
.mob a:hover{color:var(--red)}
.mob-x{position:absolute;top:1.8rem;right:2rem;font-size:1.8rem;color:var(--ink60)}

/* ─── TICKER ─── */
.ticker-wrap{
  overflow:hidden;
  border-top:1.5px solid var(--ink);
  border-bottom:1.5px solid var(--ink);
  background:var(--ink);
  position:relative;z-index:10;
  padding:.9rem 0;
}
.t-track{display:flex;width:max-content;animation:tick 32s linear infinite}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.t-item{
  font-family:'Bebas Neue',sans-serif;
  font-size:1.4rem;letter-spacing:.08em;
  color:var(--cream);white-space:nowrap;padding:0 2.5rem;
}
.t-item.acc{color:var(--red)}

/* ─── PAGE WRAPPER ─── */
.page{position:relative;z-index:1}
section{padding:clamp(5rem,10vw,10rem) clamp(1.5rem,5vw,4.5rem)}
.inner{max-width:1380px;margin:0 auto}

/* ─── TYPOGRAPHY HELPERS ─── */
.bb{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(4.5rem,14vw,16rem);
  line-height:.88;letter-spacing:.01em;
  color:var(--ink);display:block;
}
.bb-o{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(4.5rem,14vw,16rem);
  line-height:.88;letter-spacing:.01em;
  -webkit-text-stroke:1.5px var(--ink);color:transparent;display:block;
}
.sh{/* section head */
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(3rem,9vw,10rem);
  line-height:.9;letter-spacing:.01em;color:var(--ink);
}
.sh-o{-webkit-text-stroke:1.5px var(--ink);color:transparent}
.mono{
  font-family:'DM Mono',monospace;font-size:.68rem;
  letter-spacing:.25em;text-transform:uppercase;color:var(--red);
  display:flex;align-items:center;gap:.8rem;margin-bottom:1.4rem;
}
.mono::before{content:'';width:2rem;height:1.5px;background:var(--red);flex-shrink:0}
.body{
  font-size:clamp(.95rem,1.4vw,1.15rem);
  color:var(--ink60);line-height:1.82;font-weight:400;
}
.body strong{color:var(--ink);font-weight:700}
hr.dv{height:1.5px;border:none;background:var(--ink20);margin-bottom:clamp(3rem,5vw,5rem)}

/* ─── CLIP REVEAL ─── */
.clip{overflow:hidden;display:block}
.clip-inner{
  display:block;
  transform:translateY(105%);
  transition:transform 1.3s cubic-bezier(.19,1,.22,1);
}
.clip-inner.in{transform:none}
.fu{/* fade-up */
  opacity:0;transform:translateY(3rem);
  transition:opacity 1.1s ease,transform 1.1s cubic-bezier(.19,1,.22,1);
}
.fu.in{opacity:1;transform:none}

/* ─── HERO ─── */
#hero{
  min-height:100svh;display:flex;flex-direction:column;
  justify-content:flex-end;
  padding-top:8rem;padding-bottom:clamp(3rem,5vw,5rem);
  border-bottom:1.5px solid var(--ink);position:relative;
}
.hero-line{overflow:hidden}
.hero-overline{
  font-family:'DM Mono',monospace;font-size:.7rem;
  letter-spacing:.22em;text-transform:uppercase;color:var(--ink60);
  display:flex;align-items:center;gap:.7rem;margin-bottom:2.5rem;
}
.live{
  width:8px;height:8px;border-radius:50%;background:var(--red);
  box-shadow:0 0 8px var(--red);flex-shrink:0;
  animation:blink 2s infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.hero-bottom{
  display:grid;
  grid-template-columns:1fr auto;
  align-items:flex-end;gap:2rem;
  margin-top:clamp(2rem,4vw,4rem);
}
.hero-desc{
  font-size:clamp(1rem,1.5vw,1.25rem);
  color:var(--ink60);line-height:1.75;max-width:560px;
}
.hero-stats{display:flex;gap:clamp(2rem,4vw,4rem);flex-wrap:wrap;justify-content:flex-end}
.stat-n{font-family:'Bebas Neue',sans-serif;font-size:clamp(3rem,6vw,5rem);color:var(--red);line-height:1}
.stat-l{font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.15em;text-transform:uppercase;color:var(--ink60);margin-top:.3rem}

/* ─── PASSIONS STRIP ─── */
.passion-strip{
  display:grid;grid-template-columns:repeat(3,1fr);
}
.p-panel{
  position:relative;overflow:hidden;
  aspect-ratio:2/3;cursor:default;
}
.p-panel img{
  width:100%;height:100%;object-fit:cover;
  filter:grayscale(100%) contrast(1.05);
  transition:transform .9s cubic-bezier(.19,1,.22,1),filter .7s;
}
.p-panel:hover img{transform:scale(1.06);filter:grayscale(0%) contrast(1)}
.p-ov{
  position:absolute;inset:0;
  background:linear-gradient(to top,rgba(13,13,13,.92) 0%,rgba(13,13,13,.15) 50%,transparent 100%);
}
.p-label{position:absolute;bottom:0;left:0;right:0;padding:clamp(1.5rem,3vw,2.5rem)}
.p-cat{font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.28em;text-transform:uppercase;color:var(--red);margin-bottom:.6rem}
.p-title{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(2rem,5vw,4.5rem);
  letter-spacing:.03em;color:#fff;line-height:1;
}
.p-panel:not(:last-child){border-right:1.5px solid var(--ink20)}

/* ─── EXPERIENCE ─── */
.xp-item{
  border-bottom:1.5px solid var(--ink20);
  padding:clamp(2rem,4vw,3.5rem) 0;
  cursor:pointer;transition:padding .4s;
}
.xp-item:first-child{border-top:1.5px solid var(--ink20)}
.xp-item:hover{padding-left:1rem}
.xp-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:clamp(1.5rem,3vw,3rem)}
.xp-logo{
  width:clamp(52px,6vw,72px);height:clamp(52px,6vw,72px);
  background:#fff;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  padding:8px;flex-shrink:0;overflow:hidden;
  border:1px solid var(--ink20);
}
.xp-logo img{max-width:100%;max-height:100%;object-fit:contain}
.xp-co{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(2rem,5vw,4.5rem);
  line-height:1;letter-spacing:.02em;color:var(--ink);
  transition:color .3s;
}
.xp-item:hover .xp-co,.xp-item.open .xp-co{color:var(--red)}
.xp-role{font-size:clamp(.82rem,1.2vw,1rem);color:var(--ink60);margin-top:.3rem;font-weight:400}
.xp-badge{
  font-family:'DM Mono',monospace;font-size:.56rem;letter-spacing:.12em;
  text-transform:uppercase;padding:.2rem .55rem;border-radius:3px;
  border:1px solid;display:inline-block;margin-bottom:.4rem;
}
.xp-badge.alt{color:#059669;border-color:rgba(5,150,105,.35)}
.xp-badge.stage{color:#d97706;border-color:rgba(217,119,6,.35)}
.xp-date{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.12em;color:var(--ink60);text-transform:uppercase;white-space:nowrap}
.xp-plus{font-size:2rem;color:var(--ink20);transition:transform .4s,color .3s;flex-shrink:0}
.xp-item:hover .xp-plus,.xp-item.open .xp-plus{color:var(--red)}
.xp-item.open .xp-plus{transform:rotate(45deg)}
.xp-body{max-height:0;overflow:hidden;transition:max-height .6s cubic-bezier(.19,1,.22,1)}
.xp-body.open{max-height:700px}
.xp-inner{
  padding:2rem 0 .5rem 0;
  padding-left:calc(clamp(52px,6vw,72px) + clamp(1.5rem,3vw,3rem));
  border-top:1px solid var(--ink08);margin-top:1rem;
}
.xp-ul{list-style:none;display:flex;flex-direction:column;gap:.85rem;margin-bottom:1.5rem}
.xp-ul li{
  font-size:clamp(.88rem,1.2vw,1.05rem);
  color:var(--ink60);line-height:1.7;display:flex;gap:1rem;
}
.xp-ul li::before{content:'→';color:var(--red);flex-shrink:0}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{
  font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;
  padding:.3rem .85rem;border-radius:3px;
  border:1px solid var(--ink20);color:var(--ink60);
}

/* ─── PROJECTS ─── */
.proj-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  border:1.5px solid var(--ink);
}
.proj-cell{
  padding:clamp(2rem,4vw,3.5rem);
  border-right:1.5px solid var(--ink);
  border-bottom:1.5px solid var(--ink);
  cursor:pointer;
  transition:background .3s;
  display:flex;flex-direction:column;justify-content:space-between;
  min-height:clamp(280px,28vw,380px);
  position:relative;overflow:hidden;
}
.proj-cell:hover{background:var(--ink)}
.proj-cell:hover .proj-num,.proj-cell:hover .proj-title,.proj-cell:hover .proj-desc,.proj-cell:hover .proj-cta-txt{color:#fff}
.proj-cell:hover .proj-cta-arrow{color:var(--red)}
.proj-cell:nth-child(2n){border-right:none}
.proj-cell:nth-child(3),.proj-cell:nth-child(4){border-bottom:none}
.proj-num{
  font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.2em;
  color:var(--ink60);transition:color .3s;margin-bottom:1rem;
  display:flex;align-items:center;gap:.7rem;
}
.proj-award{
  font-family:'DM Mono',monospace;font-size:.55rem;letter-spacing:.12em;
  text-transform:uppercase;border:1px solid var(--red);color:var(--red);
  padding:.2rem .6rem;border-radius:2px;display:inline-block;
}
.proj-title{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(2.5rem,4.5vw,5.5rem);
  line-height:.92;letter-spacing:.01em;color:var(--ink);
  transition:color .3s;margin-bottom:.8rem;
}
.proj-desc{
  font-size:clamp(.85rem,1.1vw,.95rem);
  color:var(--ink60);line-height:1.65;flex:1;
  margin-bottom:2rem;transition:color .3s;
}
.proj-cta{display:flex;align-items:center;justify-content:space-between}
.proj-cta-txt{
  font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ink60);
  border-bottom:1px solid var(--ink20);padding-bottom:.15rem;
  transition:color .3s;
}
.proj-cta-arrow{font-size:1.4rem;color:var(--ink20);transition:transform .35s,color .3s}
.proj-cell:hover .proj-cta-arrow{transform:translate(6px,-6px)}

/* ─── SKILLS ─── */
.sk-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));
  border:1.5px solid var(--ink);
}
.sk-card{
  padding:2.2rem 2.4rem;
  border-right:1.5px solid var(--ink);
  border-bottom:1.5px solid var(--ink);
  transition:background .25s;
}
.sk-card:hover{background:var(--red)}
.sk-card:hover .sk-t,.sk-card:hover .sk-d{color:#fff}
.sk-t{font-family:'Cabinet Grotesk',sans-serif;font-weight:800;font-size:1rem;color:var(--ink);margin-bottom:.45rem;transition:color .25s;line-height:1.3}
.sk-d{font-size:.82rem;color:var(--ink60);line-height:1.65;transition:color .25s}
.sk-icon{font-size:1.4rem;margin-bottom:.9rem}

/* ─── TOOLS ─── */
.tools{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:3rem}
.tool{
  font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.08em;
  padding:.35rem .9rem;border-radius:3px;
  background:transparent;color:var(--ink60);border:1px solid var(--ink20);
  transition:all .25s;cursor:default;
}
.tool:hover{background:var(--ink);color:var(--cream);border-color:var(--ink)}

/* ─── FORMATION ─── */
.edu-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));
  border:1.5px solid var(--ink);margin-top:3rem;
}
.edu-card{
  padding:2.5rem 3rem;
  border-right:1.5px solid var(--ink);
}
.edu-card:last-child{border-right:none}
.edu-school{font-family:'DM Mono',monospace;font-size:.64rem;letter-spacing:.18em;text-transform:uppercase;color:var(--red);margin-bottom:.6rem}
.edu-deg{font-family:'Bebas Neue',sans-serif;font-size:clamp(1.4rem,2.5vw,2.2rem);letter-spacing:.02em;color:var(--ink);line-height:1.1;margin-bottom:.6rem}
.edu-dates{font-family:'DM Mono',monospace;font-size:.6rem;color:var(--ink60);margin-bottom:.9rem}
.edu-detail{font-size:.85rem;color:var(--ink60);line-height:1.65}

/* ─── CONTACT ─── */
#contact{
  background:var(--ink);
  color:var(--cream);
}
.ct-bb{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(4rem,13vw,14rem);
  line-height:.88;letter-spacing:.01em;
  color:var(--cream);
}
.ct-bb-o{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(4rem,13vw,14rem);
  line-height:.88;letter-spacing:.01em;
  -webkit-text-stroke:1.5px rgba(242,237,228,.25);color:transparent;
}
.ct-email{
  font-family:'Cabinet Grotesk',sans-serif;font-weight:800;
  font-size:clamp(1rem,2.5vw,1.8rem);
  color:var(--cream);
  border-bottom:2px solid rgba(242,237,228,.25);display:inline-block;
  padding-bottom:.25rem;transition:border-color .3s,color .3s;
}
.ct-email:hover{color:var(--red);border-color:var(--red)}
.ct-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:2rem;margin-top:4rem;padding-top:3rem;border-top:1px solid rgba(242,237,228,.1)}
.ct-label{font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(242,237,228,.35);margin-bottom:.5rem}
.ct-val{font-family:'Cabinet Grotesk',sans-serif;font-weight:600;font-size:1rem;color:var(--cream)}
footer{
  background:var(--ink);
  border-top:1px solid rgba(242,237,228,.1);
  padding:1.5rem clamp(1.5rem,5vw,4.5rem);
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;
}
footer p{font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.15em;text-transform:uppercase;color:rgba(242,237,228,.25)}

/* ─── MODAL ─── */
.modal-ov{display:none;position:fixed;inset:0;z-index:500;background:rgba(13,13,13,.96);backdrop-filter:blur(16px);align-items:center;justify-content:center;padding:1rem}
.modal-ov.open{display:flex}
.modal-box{background:var(--cream);border:2px solid var(--ink);border-radius:8px;width:100%;max-width:1020px;height:88vh;display:flex;flex-direction:column;overflow:hidden}
.m-head{padding:1.2rem 2rem;border-bottom:1.5px solid var(--ink20);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.m-ttl{font-family:'Bebas Neue',sans-serif;font-size:2rem;letter-spacing:.05em;color:var(--ink)}
.m-close{background:var(--ink);border-radius:4px;padding:.5rem 1.2rem;color:var(--cream);font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;transition:background .2s}
.m-close:hover{background:var(--red)}
.m-body{flex:1;overflow:hidden}
.pdf-ph{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem}
.pdf-ph p{font-family:'DM Mono',monospace;font-size:.75rem;color:var(--ink60);text-align:center;line-height:1.8}
.pdf-lbl{font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.15em;text-transform:uppercase;padding:.7rem 1.8rem;border-radius:4px;background:var(--ink);color:var(--cream);cursor:pointer;transition:background .2s}
.pdf-lbl:hover{background:var(--red)}
.pdf-frame{width:100%;height:100%;border:none;display:none}

/* ─── RESPONSIVE ─── */
@media(max-width:900px){
  .passion-strip{grid-template-columns:1fr}
  .p-panel{aspect-ratio:16/9}
  .proj-grid{grid-template-columns:1fr}
  .proj-cell:nth-child(n){border-right:none}
  .proj-cell:nth-child(3){border-bottom:1.5px solid var(--ink)}
  .hero-bottom{grid-template-columns:1fr;gap:2rem}
  .hero-stats{justify-content:flex-start}
}
@media(max-width:768px){
  .nav-links{display:none}
  .hbg{display:block}
  .xp-row{grid-template-columns:auto 1fr}
  .xp-date{display:none}
  .xp-inner{padding-left:0}
  .edu-grid{grid-template-columns:1fr}
  .edu-card{border-right:none;border-bottom:1.5px solid var(--ink)}
  .edu-card:last-child{border-bottom:none}
}
</style>
</head>
<body>

<!-- MOB MENU -->
<div class="mob" id="mob">
  <button class="mob-x" onclick="cMob()">✕</button>
  <a href="#about" onclick="cMob()">Profil</a>
  <a href="#experience" onclick="cMob()">Expériences</a>
  <a href="#projects" onclick="cMob()">Projets</a>
  <a href="#skills" onclick="cMob()">Compétences</a>
  <a href="#contact" onclick="cMob()">Contact</a>
</div>

<!-- NAV -->
<nav id="nav">
  <span class="nav-logo">HD.</span>
  <div class="nav-links">
    <a href="#about">Profil</a>
    <a href="#experience">Expériences</a>
    <a href="#projects">Projets</a>
    <a href="#skills">Compétences</a>
    <a href="#contact">Contact</a>
  </div>
  <button class="hbg" onclick="oMob()">☰</button>
</nav>

const { useState, useEffect, useRef } = React;

/* ── Scroll observers ── */
function useVisible(threshold = 0.08) {
  const ref = useRef(null);
  const [v, setV] = useState(false);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) setV(true); }, { threshold });
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return [ref, v];
}

/* Clip reveal — text slides up from bottom */
function Clip({ children, delay = 0 }) {
  const [ref, v] = useVisible(.05);
  return (
    <span className="clip" ref={ref}>
      <span className="clip-inner" style={{ transitionDelay: `${delay}s`, ...(v ? { transform: 'none' } : {}) }}
        ref={el => el && v && (el.style.transform = 'none')}>
        {children}
      </span>
    </span>
  );
}

/* Fade up */
function FU({ children, delay = 0, style = {} }) {
  const [ref, v] = useVisible(.06);
  return (
    <div ref={ref} className={`fu${v ? ' in' : ''}`}
      style={{ transitionDelay: `${delay}s`, ...style }}>
      {children}
    </div>
  );
}

<script>
function oMob(){ document.getElementById('mob').classList.add('open'); document.body.style.overflow='hidden'; }
function cMob(){ document.getElementById('mob').classList.remove('open'); document.body.style.overflow=''; }

const pdfStore = {};
let curId = '';
const meta = {
  trempez:'TREMPEZ', tui:"DÉCONNEC'TUI",
  rose:'ROSE FESTIVAL', edu:'ÉDUCATION NATIONALE',
};
function oModal(id, title) {
  curId = id;
  document.getElementById('mTtl').textContent = meta[id] || title;
  const frame = document.getElementById('pdfFrame'), ph = document.getElementById('pdfPh');
  if (pdfStore[id]) { frame.src = pdfStore[id]; frame.style.display='block'; ph.style.display='none'; }
  else { frame.src=''; frame.style.display='none'; ph.style.display='flex'; document.getElementById('pdfInp').value=''; }
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow='hidden';
}
function cModal() { document.getElementById('modal').classList.remove('open'); document.body.style.overflow=''; }
function loadPdf(input) {
  const file = input.files[0]; if (!file) return;
  const url = URL.createObjectURL(file);
  pdfStore[curId] = url;
  const frame = document.getElementById('pdfFrame');
  frame.src = url; frame.style.display='block';
  document.getElementById('pdfPh').style.display='none';
}
document.getElementById('modal').addEventListener('click', function(e){ if(e.target===this) cModal(); });
document.addEventListener('keydown', e => { if(e.key==='Escape') cModal(); });
window.oModal = oModal;
</script>
