<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// Reveal wrapper modifié pour plus d'impact
function useInView(threshold = 0.1) {
  const ref = useRef(null);
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) setVisible(true); }, { threshold });
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return [ref, visible];
}

function Reveal({ children, delay = 0, style = {} }) {
  const [ref, visible] = useInView(0.1);
  return (
    <div ref={ref} style={{
      opacity: visible ? 1 : 0,
      transform: visible ? 'translateY(0) scale(1)' : 'translateY(4rem) scale(0.98)',
      transition: `opacity 1s ${delay}s ease-out, transform 1.2s ${delay}s cubic-bezier(.19,1,.22,1)`,
      ...style
    }}>
      {children}
    </div>
  );
}

// Ticker
function Ticker() {
const items = ['Communication stratégique','Création de contenu','Marketing digital','Hermès','LinkedIn','Événementiel','Design graphique','Stratégie de marque','Adobe Suite','MBA ISCOM'];
const doubled = [...items, ...items];
return (
<div className="ticker">
<div className="ticker-track">
{doubled.map((item, i) => (
<span key={i} className="ticker-item">
{item} <span className="ticker-dot">◆</span>{' '}
</span>
))}
</div>
</div>
);
}

});
return (
<section id="proposition" style={{ minHeight:'100vh', display:'flex', flexDirection:'column', justifyContent:'center', paddingTop:'7rem', position:'relative', zIndex:1 }}>
<div className="inner">
{/* Overline */}
<div style={{ ...anim(.1), display:'flex', alignItems:'center', gap:'.6rem', marginBottom:'2rem', flexWrap:'wrap' }}>
<span style={{ display:'inline-flex', alignItems:'center', gap:'.45rem', fontFamily:"'DM Mono',monospace", fontSize:'.65rem', letterSpacing:'.18em', textTransform:'uppercase', color:'var(--muted)' }}>
<span style={{ width:7, height:7, borderRadius:'50%', background:'#34d399', boxShadow:'0 0 10px #34d399', animation:'pulse 2s infinite', flexShrink:0 }} />
{lang === 'fr' ? 'Disponible sept. 2026' : 'Available Sept. 2026'}
</span>
<span style={{ color:'rgba(255,255,255,.2)', fontFamily:'monospace' }}>·</span>
<span style={{ fontFamily:"'DM Mono',monospace", fontSize:'.65rem', letterSpacing:'.18em', textTransform:'uppercase', color:'var(--muted)' }}>
MBA ISCOM Paris
</span>
</div>

    {/* Big question */}
    <div style={{ ...anim(.15), overflow:'hidden' }}>
      <h1 style={{
        fontFamily:"'Cabinet Grotesk',sans-serif", fontWeight:800,
        fontSize:'clamp(1.1rem,2.5vw,1.5rem)', letterSpacing:'.12em', textTransform:'uppercase',
        color:'rgba(255,255,255,.5)', marginBottom:'1rem'
      }}>
        {lang === 'fr' ? 'Et si j\'étais votre prochain alternant ?' : 'What if I were your next work-study hire?'}
      </h1>
    </div>

    <div style={{ ...anim(.2) }}>

        {lang === 'fr'
          ? "Stratège et créatif, j'apporte avec moi 3 expériences professionnelles solides dont une chez Hermès, une maîtrise des outils du marketing digital et une capacité prouvée à produire du contenu qui génère des résultats."

// Passion Carousel avec nouvelles images
function PassionCarousel({ lang }) {
const [cur, setCur] = useState(0);
const slides = [
{
img: 'https://media.lesechos.com/api/v1/images/view/67adf5173d2c9b436a35c07e/1280x720/0140809604526-web-tete.jpg',
label: 'BALLET & OPÉRA',
sub: lang === 'fr' ? 'Onéguine · Lac des Cygnes · Paquita' : 'Onegin · Swan Lake · Paquita',
},
{
img: 'https://cinedweller.com/wp-content/uploads/2025/03/queer-affiche.jpg.webp',
label: 'CINÉMA',
sub: lang === 'fr' ? 'The Substance · Queer · L\'Inconnu de la Grande Arche' : 'The Substance · Queer · L\'Inconnu de la Grande Arche',
},
{
img: 'https://www.radiofrance.fr/pikapi/images/bc7bbc48-c4b2-45e8-a3d3-c7aa8156b4b0/1200x680?webp=false',
label: 'MODE',
sub: 'Balenciaga · Gucci · Hermès',
},
];
const total = slides.length;

useEffect(() => {
const t = setInterval(() => setCur(c => (c + 1) % total), 4500);
return () => clearInterval(t);
}, []);

return (
<div style={{ position:'relative', borderRadius:20, overflow:'hidden', height:'clamp(350px,50vw,550px)', border:'1px solid var(--border)' }}>
{slides.map((s, i) => (
<div key={i} style={{

}}>
<img src={s.img} alt={s.label} style={{ width:'100%', height:'100%', objectFit:'cover', filter:'brightness(.6)' }} />
<div style={{ position:'absolute', inset:0, background:'linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.2) 60%, transparent 100%)' }} />
<div style={{ position:'absolute', bottom:0, left:0, right:0, padding:'2.5rem' }}>
<div style={{ fontFamily:"'DM Mono',monospace", fontSize:'.65rem', letterSpacing:'.25em', textTransform:'uppercase', color:'var(--muted)', marginBottom:'.8rem' }}>
{lang === 'fr' ? 'Passion' : 'Passion'}
</div>
<div style={{ fontFamily:"'Cabinet Grotesk',sans-serif", fontWeight:900, fontSize:'clamp(2.2rem,5vw,4.5rem)', lineHeight:1, letterSpacing:'-.03em', color:'var(--fg)' }}>
{s.label}
</div>
<div style={{ fontFamily:"'DM Mono',monospace", fontSize:'.7rem', color:'var(--muted)', marginTop:'.8rem', letterSpacing:'.05em' }}>
{s.sub}
</div>
</div>
</div>
))}

  {/* Arrows */}
  {[
    { dir:'prev', icon:'‹', action:() => setCur(c => (c - 1 + total) % total), pos:'left:1.5rem' },
    { dir:'next', icon:'›', action:() => setCur(c => (c + 1) % total), pos:'right:1.5rem' },

  {/* Dots */}
