<meta property="og:title" content="Hugo Descouts · Alternance MBA ISCOM 2026"/>
<meta property="og:description" content="Stratège et créatif. Futur MBA ISCOM Paris. Expériences chez Hermès, UNPPD et Corporate Fiction. Disponible en alternance dès septembre 2026."/>
<meta property="og:image" content="https://media.licdn.com/dms/image/v2/D4E03AQEJY8yuOnA8QQ/profile-displayphoto-scale_400_400/B4EZv.5jbGJUAg-/0/1769508060323?e=1774483200&v=beta&t=rf_Y_We2upB4BnxgHxf9d8De7ELblGq8f2PZxT8djtA"/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
:root{--ink:#0a0a0a;--paper:#F2EDE6;--paper2:#E8E2D9;--red:#FF3D00;--red2:#CC3100;--white:#FAFAF8;--muted:rgba(10,10,10,.48);--mutedp:rgba(242,237,230,.48);--bi:rgba(10,10,10,.1);--bw:rgba(255,255,255,.08)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;background:var(--ink);cursor:none}
body{background:var(--ink);color:var(--white);font-family:'Syne',sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
button{cursor:none;border:none;background:none;color:inherit;font-family:inherit}
a{color:inherit;text-decoration:none;cursor:none}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:var(--ink)}::-webkit-scrollbar-thumb{background:var(--red)}

/* CURSOR */
#cur{position:fixed;z-index:9999;pointer-events:none;mix-blend-mode:difference;top:0;left:0}
#cur-dot{width:8px;height:8px;background:var(--white);border-radius:50%;position:absolute;transform:translate(-50%,-50%);transition:width .2s,height .2s}
#cur-ring{width:38px;height:38px;border:1.5px solid rgba(255,255,255,.7);border-radius:50%;position:absolute;transform:translate(-50%,-50%);transition:width .3s,height .3s,border-color .3s;opacity:.5}
body.hov #cur-dot{width:5px;height:5px}
body.hov #cur-ring{width:56px;height:56px;border-color:var(--red);opacity:1}
body.clk #cur-ring{width:22px;height:22px}

/* GRAIN */
body::before{content:'';position:fixed;inset:0;z-index:9998;pointer-events:none;opacity:.025;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}

/* NAV */
#nav{position:fixed;top:0;left:0;right:0;z-index:500;padding:1.2rem clamp(1.5rem,4vw,3.5rem);display:flex;align-items:center;justify-content:space-between;transition:background .4s,border .4s}
#nav.sc{background:rgba(10,10,10,.96);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,61,0,.12)}
.n-logo{font-family:'Bebas Neue',sans-serif;font-size:2rem;color:var(--white);letter-spacing:.08em;line-height:1}
.n-logo span{color:var(--red)}
.n-links{display:flex;gap:2.5rem;align-items:center}
.n-links a{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.2em;color:rgba(250,250,248,.45);transition:color .2s;position:relative}
.n-links a::after{content:'';position:absolute;bottom:-3px;left:0;width:0;height:1px;background:var(--red);transition:width .3s}
.n-links a:hover{color:var(--white)}
.n-links a:hover::after{width:100%}
.hbg{display:none;font-size:1.6rem;color:var(--white)}
.n-cta{font-size:.65rem!important;font-weight:700;letter-spacing:.18em;text-transform:uppercase;border:1px solid rgba(255,61,0,.4);color:var(--red)!important;padding:.42rem 1.1rem;border-radius:2px;transition:all .25s}
.n-cta:hover{background:var(--red)!important;color:var(--white)!important}
.n-cta::after{display:none!important}

/* MOB */
.mob{display:none;position:fixed;inset:0;background:var(--ink);z-index:600;flex-direction:column;justify-content:flex-end;padding:clamp(3rem,7vw,5rem);gap:1rem}
.mob.open{display:flex}
.mob a{font-family:'Bebas Neue',sans-serif;font-size:clamp(3.5rem,10vw,7rem);color:var(--white);line-height:1.05;border-bottom:1px solid var(--bw);padding-bottom:.3rem;transition:color .25s,padding-left .25s;letter-spacing:.04em}
.mob a:hover{color:var(--red);padding-left:.8rem}
.mob-x{position:absolute;top:1.8rem;right:2rem;font-size:1.6rem;color:rgba(250,250,248,.35)}

/* LAYOUT */
.page{position:relative;z-index:1}
section{padding:clamp(5rem,10vw,9rem) clamp(1.5rem,5vw,4rem)}
.inner{max-width:1440px;margin:0 auto}

/* REVEAL */
.fade-up{opacity:0;transform:translateY(38px);transition:opacity .85s ease,transform .85s cubic-bezier(.16,1,.3,1)}
.fade-up.in{opacity:1;transform:none}
.clip-r{clip-path:inset(0 0 100% 0);transform:translateY(16px);transition:clip-path .9s cubic-bezier(.16,1,.3,1),transform .9s cubic-bezier(.16,1,.3,1)}
.clip-r.in{clip-path:inset(0 0 0% 0);transform:none}

/* TYPOGRAPHY */
.display{font-family:'Bebas Neue',sans-serif;font-size:clamp(5rem,15vw,18rem);line-height:.85;letter-spacing:.02em;text-transform:uppercase;overflow:visible}
.sec-label{font-size:.6rem;font-weight:700;letter-spacing:.35em;text-transform:uppercase;color:var(--red);display:flex;align-items:center;gap:.8rem;margin-bottom:1.2rem}
.sec-label::before{content:'';width:2.5rem;height:1px;background:var(--red);flex-shrink:0}
.sec-h{font-family:'Bebas Neue',sans-serif;font-size:clamp(3rem,8vw,9rem);line-height:.92;letter-spacing:.03em;text-transform:uppercase;margin-bottom:clamp(2.5rem,5vw,4rem);overflow:visible}
/* sec-h span outline variant */ .sec-h-o{-webkit-text-stroke:2px currentColor;color:transparent}
.sec-h-lt{color:var(--ink)}
.sl-lt{color:var(--red2)}
.sl-lt::before{background:var(--red2)}

/* BADGE */
.badge{display:inline-flex;align-items:center;gap:.7rem;background:rgba(255,61,0,.07);border:1px solid rgba(255,61,0,.28);border-radius:2px;padding:.48rem 1.1rem;font-size:.63rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--red)}
.dot{width:7px;height:7px;background:var(--red);border-radius:50%;box-shadow:0 0 10px var(--red);animation:blink 1.8s infinite;flex-shrink:0}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.1}}

/* TICKER */
.ticker{overflow:hidden;background:var(--red);padding:1rem 0;transform:rotate(-1.2deg) scale(1.04);margin:4rem 0;box-shadow:0 15px 50px rgba(255,61,0,.3);position:relative;z-index:2}
.tk-track{display:flex;width:max-content;animation:tk 20s linear infinite}
@keyframes tk{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tk-item{font-family:'Bebas Neue',sans-serif;font-size:2.5rem;color:var(--white);white-space:nowrap;padding:0 2rem;letter-spacing:.04em}
.tk-sep{color:rgba(255,255,255,.35);margin:0 1rem}

/* HERO */
.hero-layout{display:grid;grid-template-columns:1fr clamp(260px,30vw,460px);min-height:100svh;position:relative}
.hero-left{display:flex;flex-direction:column;justify-content:flex-end;padding:8rem clamp(1.5rem,4vw,3.5rem) clamp(3rem,5vw,5rem);position:relative;z-index:1}
.hero-right{position:relative;overflow:hidden;flex-shrink:0}
.hero-right::before{content:'';position:absolute;inset:0;background:linear-gradient(to right,var(--ink) 0%,transparent 30%);z-index:1;pointer-events:none}
.hero-right-img{width:100%;height:100%;object-fit:cover;object-position:center top;filter:grayscale(20%);display:block;transition:filter 8s ease}
.hero-right-img:hover{filter:grayscale(0%)}
.hero-right-label{position:absolute;bottom:2rem;right:1.5rem;z-index:2;font-size:.56rem;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.28);writing-mode:vertical-rl}
/* red accent line on photo */
.hero-right::after{content:'';position:absolute;top:0;left:0;width:2px;height:100%;background:var(--red);z-index:2}
#hero{position:relative;overflow:hidden;border-bottom:1px solid var(--bw)}
#hero::after{content:'';position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,61,0,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,61,0,.025) 1px,transparent 1px);background-size:80px 80px}
.hero-yr{font-family:'Bebas Neue',sans-serif;font-size:clamp(2rem,4vw,4rem);color:rgba(255,255,255,.04);position:absolute;right:clamp(1.5rem,5vw,4rem);top:50%;transform:translateY(-50%);writing-mode:vertical-rl;user-select:none;letter-spacing:.08em}
.hero-bottom{display:grid;grid-template-columns:1fr auto;align-items:flex-end;gap:2rem;margin-top:clamp(4rem,7vw,7rem);padding-bottom:clamp(3rem,5vw,5rem);position:relative;z-index:1}
.hero-desc{font-size:clamp(.95rem,1.4vw,1.1rem);color:rgba(250,250,248,.5);line-height:1.85;max-width:520px;font-weight:500}
.hero-photo{width:clamp(64px,8vw,100px);height:clamp(64px,8vw,100px);border-radius:50%;object-fit:cover;border:2px solid rgba(255,61,0,.5);box-shadow:0 0 0 5px rgba(255,61,0,.08);flex-shrink:0}
.hero-stats{display:flex;gap:clamp(2rem,4vw,4rem);flex-wrap:wrap;justify-content:flex-end}
.s-n{font-family:'Bebas Neue',sans-serif;font-size:clamp(3.5rem,7vw,6rem);color:var(--red);line-height:1}
.s-l{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.16em;color:rgba(250,250,248,.35);margin-top:.3rem}
.btn-cta{display:inline-flex;align-items:center;gap:.8rem;background:var(--red);color:var(--white);font-family:'Syne',sans-serif;font-weight:700;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;padding:.9rem 2.2rem;border-radius:2px;transition:background .2s,transform .2s,color .2s;position:relative;overflow:hidden}
.btn-cta::before{content:'';position:absolute;inset:0;background:var(--white);transform:translateX(-101%);transition:transform .3s cubic-bezier(.16,1,.3,1)}
.btn-cta:hover::before{transform:none}
.btn-cta:hover{color:var(--ink);transform:translateY(-2px)}
.btn-cta span{position:relative;z-index:1}
.btn-ghost{background:transparent;color:rgba(250,250,248,.55);border:1px solid rgba(255,255,255,.15)}
.btn-ghost::before{display:none}
.btn-ghost:hover{color:var(--white);background:rgba(255,255,255,.06);transform:translateY(-2px)}

/* ABOUT — PAPER */
#about{background:var(--paper);color:var(--ink);position:relative}
#about::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--red)}
.about-intro{font-family:'Bebas Neue',sans-serif;font-size:clamp(2rem,4vw,4.5rem);line-height:1;color:var(--ink);margin-bottom:2rem;letter-spacing:.02em}
.about-body{font-size:clamp(.88rem,1.2vw,1rem);color:var(--muted);line-height:1.9;max-width:640px;font-weight:500}
.pp-grid{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid rgba(10,10,10,.1)}
.pp{position:relative;overflow:hidden;aspect-ratio:3/4}
.pp img{width:100%;height:100%;object-fit:cover;filter:grayscale(100%);transition:transform .8s cubic-bezier(.16,1,.3,1),filter .6s;display:block}
.pp:hover img{transform:scale(1.08);filter:grayscale(0%)}
.pp-ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(10,10,10,.95) 0%,rgba(10,10,10,.2) 55%,transparent 100%);opacity:0;transition:opacity .4s}
.pp:hover .pp-ov{opacity:1}
.pp-lbl{position:absolute;bottom:0;left:0;right:0;padding:2rem;transform:translateY(12px);opacity:0;transition:transform .4s cubic-bezier(.16,1,.3,1),opacity .4s}
.pp:hover .pp-lbl{transform:none;opacity:1}
.pp-cat{font-size:.56rem;font-weight:700;letter-spacing:.32em;text-transform:uppercase;color:var(--red);margin-bottom:.4rem}
.pp-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(2rem,4vw,3.5rem);color:var(--white);letter-spacing:.04em}
.pp-sub{font-size:.62rem;color:rgba(255,255,255,.45);margin-top:.3rem;font-weight:500}
.pp:not(:last-child){border-right:1px solid rgba(10,10,10,.1)}

/* HERMÈS */
#hermes{padding:0;position:relative;min-height:100vh;display:flex;align-items:center;overflow:hidden;background:var(--ink)}
.hm-vline{position:absolute;top:0;bottom:0;width:1px;background:linear-gradient(to bottom,transparent,rgba(255,255,255,.04),transparent);animation:vfade 5s ease-in-out infinite}
@keyframes vfade{0%,100%{opacity:.2}50%{opacity:.9}}
.hm-stripe{position:absolute;top:0;bottom:0;right:0;width:50%;background:linear-gradient(to right,transparent,rgba(255,61,0,.02))}
.hm-content{position:relative;z-index:2;width:100%;max-width:1440px;margin:0 auto;padding:clamp(5rem,9vw,9rem) clamp(1.5rem,5vw,4rem);display:grid;grid-template-columns:1fr 1fr;gap:clamp(3rem,6vw,8rem);align-items:center}
.hm-tag{display:inline-flex;align-items:center;gap:.6rem;background:rgba(255,61,0,.07);border:1px solid rgba(255,61,0,.22);border-radius:2px;padding:.35rem 1rem;font-size:.6rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--red);margin-bottom:2.5rem}
.hm-logo{width:78px;height:78px;background:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center;padding:10px;margin-bottom:2rem;border:1px solid var(--bw)}
.hm-logo img{max-width:100%;max-height:100%;object-fit:contain}
.hm-co{font-family:'Bebas Neue',sans-serif;font-size:clamp(5rem,12vw,13rem);line-height:.88;letter-spacing:.02em;color:var(--white);margin-bottom:1rem;overflow:visible}
.hm-co-o{-webkit-text-stroke:1px rgba(255,255,255,.18);color:transparent}
.hm-role{font-size:.7rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.3);margin-bottom:2.5rem}
.hm-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--bw);border:1px solid var(--bw)}
.hm-kpi{background:var(--ink);padding:1.8rem 1.2rem;text-align:center;transition:background .3s}
.hm-kpi:hover{background:rgba(255,61,0,.06)}
.hm-kn{font-family:'Bebas Neue',sans-serif;font-size:clamp(2rem,4.5vw,3.8rem);color:var(--red);line-height:1}
.hm-kl{font-size:.56rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.28);margin-top:.4rem}
.hm-missions{list-style:none;display:flex;flex-direction:column}
.hm-mi{padding:1.4rem 0;border-bottom:1px solid var(--bw);display:flex;gap:1.2rem;align-items:flex-start;transition:padding-left .3s,background .3s}
.hm-mi:hover{padding-left:.6rem}
.hm-mi-n{font-family:'Bebas Neue',sans-serif;font-size:2.2rem;color:rgba(255,61,0,.18);line-height:1;flex-shrink:0;transition:color .3s;min-width:3rem}
.hm-mi:hover .hm-mi-n{color:var(--red)}
.hm-mi-t{font-weight:500;font-size:clamp(.83rem,1.1vw,.95rem);color:rgba(255,255,255,.5);line-height:1.75}

/* EXPERIENCE — PAPER2 */
#experience{background:var(--paper2);color:var(--ink);position:relative;overflow:hidden}
#experience::after{content:'XP';position:absolute;right:-1rem;bottom:-4rem;font-family:'Bebas Neue',sans-serif;font-size:22vw;color:rgba(10,10,10,.035);pointer-events:none;line-height:1;letter-spacing:.02em}
.xp-i{border-bottom:1px solid var(--bi);padding:clamp(1.8rem,3.5vw,3rem) 0;transition:padding-left .3s;position:relative}
.xp-i:first-child{border-top:1px solid var(--bi)}
.xp-i:hover{padding-left:.8rem}
.xp-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:clamp(1.5rem,3vw,3rem)}
.xp-logo{width:clamp(50px,5.5vw,65px);height:clamp(50px,5.5vw,65px);background:var(--paper);border-radius:6px;display:flex;align-items:center;justify-content:center;padding:8px;flex-shrink:0;overflow:hidden;border:1px solid var(--bi)}
.xp-logo img{max-width:100%;max-height:100%;object-fit:contain}
.xp-co{font-family:'Bebas Neue',sans-serif;font-size:clamp(2rem,5vw,4.5rem);line-height:1;color:var(--ink);transition:color .25s;letter-spacing:.03em}
.xp-i:hover .xp-co,.xp-i.open .xp-co{color:var(--red)}
.xp-role{font-size:clamp(.75rem,1vw,.88rem);color:var(--muted);margin-top:.25rem;font-weight:500}
.xp-bdg{font-size:.52rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:.16rem .5rem;border-radius:2px;border:1px solid;display:inline-block;margin-bottom:.35rem}
.alt{color:#15803d;border-color:rgba(21,128,61,.3)}.stg{color:#92400e;border-color:rgba(146,64,14,.3)}
.xp-date{font-size:.6rem;font-weight:600;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;white-space:nowrap}
.xp-plus{font-size:1.8rem;color:rgba(10,10,10,.18);transition:transform .4s,color .25s;line-height:1}
.xp-i:hover .xp-plus,.xp-i.open .xp-plus{color:var(--red)}
.xp-i.open .xp-plus{transform:rotate(45deg)}
.xp-body{max-height:0;overflow:hidden;transition:max-height .7s cubic-bezier(.16,1,.3,1)}
.xp-body.open{max-height:500px}
.xp-inn{padding:1.8rem 0 .5rem calc(clamp(50px,5.5vw,65px) + clamp(1.5rem,3vw,3rem));border-top:1px solid var(--bi);margin-top:1rem}
.xp-ul{list-style:none;display:flex;flex-direction:column;gap:.75rem;margin-bottom:1.4rem}
.xp-ul li{font-size:clamp(.83rem,1vw,.92rem);color:var(--muted);line-height:1.72;display:flex;gap:.9rem;font-weight:500}
.xp-ul li::before{content:'→';color:var(--red2);flex-shrink:0}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{font-size:.56rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:.26rem .72rem;border-radius:2px;border:1px solid var(--bi);color:var(--muted)}

/* PROJECTS — INK */
#projects{background:var(--ink);position:relative;overflow:hidden}
.pj-grid{display:grid;grid-template-columns:repeat(2,1fr);border-top:1px solid var(--bw);border-left:1px solid var(--bw);margin-top:clamp(2.5rem,4vw,4rem)}
.pj{padding:clamp(2rem,4vw,3.5rem);border-right:1px solid var(--bw);border-bottom:1px solid var(--bw);position:relative;overflow:hidden;min-height:clamp(300px,26vw,400px);display:flex;flex-direction:column;justify-content:space-between;transition:border-color .3s}
.pj:nth-child(2n){border-right:none}
.pj:nth-child(3),.pj:nth-child(4){border-bottom:none}
/* fill from bottom on hover */
.pj::before{content:'';position:absolute;inset:0;background:var(--red);transform:translateY(102%);transition:transform .5s cubic-bezier(.16,1,.3,1);z-index:0}
.pj:hover::before{transform:none}
.pj>*{position:relative;z-index:1}
.pj-num{font-size:.6rem;font-weight:700;letter-spacing:.22em;color:rgba(255,255,255,.28);margin-bottom:.8rem;display:flex;align-items:center;gap:.7rem;transition:color .3s}
.pj:hover .pj-num{color:rgba(255,255,255,.6)}
.pj-aw{font-size:.5rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border:1px solid rgba(255,255,255,.28);padding:.14rem .5rem;border-radius:2px;transition:border-color .3s}
.pj:hover .pj-aw{border-color:rgba(255,255,255,.7)}
.pj-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(2.5rem,5.5vw,5.5rem);line-height:.9;color:var(--white);margin-bottom:.8rem;letter-spacing:.02em;transition:letter-spacing .4s}
.pj:hover .pj-title{letter-spacing:.04em}
.pj-desc{font-size:clamp(.8rem,1vw,.9rem);color:rgba(255,255,255,.42);line-height:1.65;flex:1;margin-bottom:2rem;transition:color .3s;font-weight:500}
.pj:hover .pj-desc{color:rgba(255,255,255,.82)}

const { useState, useEffect, useRef } = React;

function useReveal(t = 0.08) {
  const ref = useRef(null);
  const [v, setV] = useState(false);
  useEffect(() => {
    const o = new IntersectionObserver(([e]) => { if (e.isIntersecting) setV(true); }, { threshold: t });
    if (ref.current) o.observe(ref.current);
    return () => o.disconnect();
  }, []);
  return [ref, v];
}

function FU({ children, delay = 0, style = {}, className = '' }) {
  const [ref, v] = useReveal();
  return <div ref={ref} className={`fade-up${v?' in':''} ${className}`} style={{ transitionDelay:`${delay}s`, ...style }}>{children}</div>;
}

function CR({ children, delay = 0, style = {}, className = '', tag = 'div' }) {
  const [ref, v] = useReveal();
  const Tag = tag;
  return <Tag ref={ref} className={`clip-r${v?' in':''} ${className}`} style={{ transitionDelay:`${delay}s`, ...style }}>{children}</Tag>;
}

<script>
/* CURSOR */
(function(){
  const dot = document.getElementById('cur-dot');
  const ring = document.getElementById('cur-ring');
  if (!dot || !ring) return;
  let mx=0,my=0,rx=0,ry=0;
  document.addEventListener('mousemove',e=>{
    mx=e.clientX; my=e.clientY;
    dot.style.left=mx+'px'; dot.style.top=my+'px';
  });
  (function loop(){
    rx+=(mx-rx)*.11; ry+=(my-ry)*.11;
    ring.style.left=rx+'px'; ring.style.top=ry+'px';
    requestAnimationFrame(loop);
  })();
  function bind(){
    document.querySelectorAll('a,button,.pj,.pp,.sk-c,.edu-c,.xp-i,.hm-mi,.hm-kpi,.tool').forEach(el=>{
      el.addEventListener('mouseenter',()=>document.body.classList.add('hov'));
      el.addEventListener('mouseleave',()=>document.body.classList.remove('hov'));
    });
  }
  bind();
  setTimeout(bind, 1600);
  document.addEventListener('mousedown',()=>document.body.classList.add('clk'));
  document.addEventListener('mouseup',()=>document.body.classList.remove('clk'));
})();

function oMob(){ document.getElementById('mob').classList.add('open'); document.body.style.overflow='hidden'; }
function cMob(){ document.getElementById('mob').classList.remove('open'); document.body.style.overflow=''; }
</script>
