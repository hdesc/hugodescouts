<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Hugo Descouts Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  :root {
    --bg-dark: #05130b;
    --bg-card: #10b981;
    --fg-light: #ffffff;
    --fg-dark: #022c22;
    --accent: #34d399;
    --border: rgba(52, 211, 153, 0.2);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; background: var(--bg-dark); }
  body { 
    background: var(--bg-dark); 
    color: var(--fg-light); 
    font-family: 'Space Grotesk', sans-serif; 
    overflow-x: hidden; 
    -webkit-font-smoothing: antialiased; 
  }
  
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg-dark); }
  ::-webkit-scrollbar-thumb { background: var(--bg-card); border-radius: 4px; }
  img { display: block; max-width: 100%; }
  button { cursor: pointer; border: none; background: none; color: inherit; font-family: inherit; }
  a { color: inherit; text-decoration: none; cursor: pointer; }

  /* Bruit de fond */
  body::before { 
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 999;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E"); 
  }

  /* Ticker */
  .ticker { overflow: hidden; background: var(--fg-light); padding: 1.5rem 0; transform: rotate(-2deg) scale(1.05); margin: 4rem 0; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .ticker-track { display: flex; width: max-content; animation: tk 20s linear infinite; }
  @keyframes tk { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .ticker-item { font-family: 'Archivo Black', sans-serif; font-size: 2.5rem; color: var(--fg-dark); white-space: nowrap; padding: 0 2rem; text-transform: uppercase; }

  /* Nav */
  #nav { position: fixed; top: 0; left: 0; right: 0; z-index: 500; padding: 1.5rem 3rem; display: flex; align-items: center; justify-content: space-between; transition: all 0.4s; }
  #nav.scrolled { background: rgba(5, 19, 11, 0.95); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); padding: 1rem 3rem; }
  .n-logo { font-family: 'Archivo Black', sans-serif; font-size: 2rem; color: var(--accent); }
  .n-links { display: flex; gap: 3rem; }
  .n-links a { font-weight: 700; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.1em; transition: color 0.3s; }
  .n-links a:hover { color: var(--accent); }

  /* Layout */
  .page { position: relative; z-index: 1; }
  section { padding: 8vw 4vw; }
  .inner { max-width: 1400px; margin: 0 auto; }

  /* Typographie massive */
  .title-massive { font-family: 'Archivo Black', sans-serif; font-size: clamp(4rem, 12vw, 15rem); line-height: 0.85; text-transform: uppercase; letter-spacing: -0.04em; }
  .title-outline { -webkit-text-stroke: 2px var(--fg-light); color: transparent; }
  .section-title { font-family: 'Archivo Black', sans-serif; font-size: clamp(3rem, 7vw, 7rem); line-height: 0.9; text-transform: uppercase; margin-bottom: 4rem; text-align: center; }
  .section-title span { -webkit-text-stroke: 2px var(--fg-light); color: transparent; }

  /* Boutons et badges */
  .badge { display: inline-flex; align-items: center; gap: 0.8rem; background: rgba(52, 211, 153, 0.1); border: 1px solid var(--accent); border-radius: 999px; padding: 0.6rem 1.5rem; font-weight: 700; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); margin-bottom: 3rem; }

  /* Animations React */
  .reveal { opacity: 0; transform: translateY(40px); transition: all 1s cubic-bezier(0.19, 1, 0.22, 1); }
  .reveal.visible { opacity: 1; transform: translateY(0); }

  /* Cartes */
  .grid-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 2rem; }
  
  .card-solid { background: var(--bg-card); border-radius: 24px; padding: 3rem; color: var(--fg-dark); transition: transform 0.4s; position: relative; overflow: hidden; }
  .card-solid:hover { transform: translateY(-10px); }
  .card-solid h3 { font-family: 'Archivo Black', sans-serif; font-size: 2rem; margin-bottom: 1.5rem; text-transform: uppercase; }
  .card-solid p { font-weight: 600; line-height: 1.6; font-size: 1.1rem; }

  /* Carte spécifique Hermès */
  .hermes-highlight { background: linear-gradient(135deg, #059669, #064e3b); border: 2px solid var(--accent); color: var(--fg-light); grid-column: 1 / -1; box-shadow: 0 15px 40px rgba(0,0,0,0.4); }
  .hermes-highlight h3 { color: var(--fg-light); font-size: 3rem; }
  .hermes-highlight .role-text { color: var(--accent); font-size: 1.3rem; }
  .hermes-highlight p { color: rgba(255,255,255,0.9); }
  .tag-highlight { display: inline-block; background: var(--fg-light); color: var(--fg-dark); padding: 0.5rem 1rem; border-radius: 999px; font-weight: 800; font-size: 0.8rem; text-transform: uppercase; margin-bottom: 2rem; }

  .card-dark { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 24px; padding: 3rem; transition: all 0.4s; }
  .card-dark:hover { background: rgba(52, 211, 153, 0.05); border-color: var(--accent); }

  /* Cartes Outils / Formations */
  .card-outline { border: 2px solid var(--bg-card); border-radius: 24px; padding: 3rem; transition: all 0.3s; height: 100%; display: flex; flex-direction: column; }
  .card-outline:hover { background: var(--bg-card); color: var(--fg-dark); }
  .card-outline h4 { font-family: 'Archivo Black', sans-serif; font-size: 1.6rem; text-transform: uppercase; margin-bottom: 2rem; }
  .card-outline ul { list-style: none; display: flex; flex-direction: column; gap: 1rem; flex-grow: 1; }
  .card-outline li { font-weight: 600; font-size: 1.1rem; display: flex; align-items: flex-start; gap: 1rem; }
  .card-outline li::before { content: '✦'; color: inherit; }
  .card-outline:hover p, .card-outline:hover li { color: var(--fg-dark) !important; }

  /* Images Zoom */
  .img-zoom-container { overflow: hidden; border-radius: 24px; position: relative; height: 500px; }
  .img-zoom { width: 100%; height: 100%; object-fit: cover; transition: transform 0.8s cubic-bezier(0.19, 1, 0.22, 1); }
  .img-zoom-container:hover .img-zoom { transform: scale(1.1); }
  .img-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(5,19,11,0.9), transparent); display: flex; flex-direction: column; justify-content: flex-end; padding: 3rem; pointer-events: none; }
  .img-overlay h3 { font-family: 'Archivo Black', sans-serif; font-size: 3rem; text-transform: uppercase; }

  /* Logos */
  .logo-box { width: 80px; height: 80px; background: var(--fg-light); border-radius: 16px; display: flex; align-items: center; justify-content: center; padding: 15px; flex-shrink: 0; }
  .logo-box img { max-width: 100%; max-height: 100%; object-fit: contain; }

  /* Bouton Drive */
  .btn-drive { display: inline-block; background: var(--fg-dark); color: var(--accent); padding: 1rem 2rem; border-radius: 999px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; margin-top: 2rem; border: 2px solid var(--fg-dark); transition: all 0.3s; }
  .btn-drive:hover { background: transparent; color: var(--fg-dark); }
  .card-dark .btn-drive { background: var(--accent); color: var(--fg-dark); border-color: var(--accent); }
  .card-dark .btn-drive:hover { background: transparent; color: var(--accent); }

  @media(max-width: 768px) { .n-links { display: none; } .title-massive { font-size: 5rem; } .hermes-highlight h3 { font-size: 2rem; } }
</style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

function Navbar() {
  const [scrolled, setScrolled] = useState(false);

  useEffect(() => {
    const handleScroll = () => {
      setScrolled(window.scrollY > 50);
    };
    window.addEventListener('scroll', handleScroll);
    return () => window.removeEventListener('scroll', handleScroll);
  }, []);

  return (
    <nav id="nav" className={scrolled ? 'scrolled' : ''}>
      <div className="n-logo">HD</div>
      <div className="n-links">
        <a href="#about">Profil</a>
        <a href="#experience">Expériences</a>
        <a href="#projects">Projets</a>
        <a href="#skills">Compétences</a>
        <a href="#contact">Contact</a>
      </div>
    </nav>
  );
}

function FadeUp({ children, delay = 0 }) {
  const ref = useRef(null);
  const [visible, setVisible] = useState(false);

  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => { 
      if (e.isIntersecting) setVisible(true); 
    }, { threshold: 0.1 });
    
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  
  return (
    <div ref={ref} className={`reveal ${visible ? 'visible' : ''}`} style={{ transitionDelay: `${delay}s` }}>
      {children}
    </div>
  );
}

function Hero() {
  return (
    <section style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', justifyContent: 'center', paddingTop: '15vh' }}>
      <div className="inner">
        <FadeUp>
          <div className="badge">
            <span style={{ width: 10, height: 10, background: 'var(--accent)', borderRadius: '50%' }}></span>
            Disponible Septembre 2026
          </div>
        </FadeUp>
        
        <FadeUp delay={0.1}>
          <div className="title-massive">HUGO</div>
        </FadeUp>
        <FadeUp delay={0.2}>
          <div className="title-massive title-outline" style={{ marginTop: '-2rem' }}>DESCOUTS</div>
        </FadeUp>
        
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))', gap: '4rem', marginTop: '6rem' }}>
          <FadeUp delay={0.3}>
            <p style={{ fontSize: '1.4rem', lineHeight: 1.6, color: 'rgba(255,255,255,0.8)', maxWidth: '600px', fontWeight: 600 }}>
              Futur étudiant en MBA ISCOM Paris. J'allie vision stratégique et exécution créative pour concevoir des campagnes qui marquent les esprits et génèrent des résultats concrets.
            </p>
          </FadeUp>
          <FadeUp delay={0.4}>
            <div style={{ display: 'flex', gap: '4rem', flexWrap: 'wrap' }}>
              <div>
                <div style={{ fontFamily: "'Archivo Black', sans-serif", fontSize: '4rem', color: 'var(--accent)' }}>3</div>
                <div style={{ fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.1em' }}>Expériences pro</div>
              </div>
              <div>
                <div style={{ fontFamily: "'Archivo Black', sans-serif", fontSize: '4rem', color: 'var(--accent)' }}>4</div>
                <div style={{ fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.1em' }}>Projets phares</div>
              </div>
            </div>
          </FadeUp>
        </div>
      </div>
    </section>
  );
}

function Ticker() {
  const items = ["Stratégie Digitale", "Création de contenu", "Hermès", "Direction Artistique", "Social Media", "MBA ISCOM"];
  return (
    <div className="ticker">
      <div className="ticker-track">
        {[...items, ...items, ...items].map((item, i) => (
          <span key={i} className="ticker-item">{item} <span style={{ color: 'var(--accent)', margin: '0 2rem' }}>✦</span></span>
        ))}
      </div>
    </div>
  );
}

function Passions() {
  const slides = [
    { img: "https://media.lesechos.com/api/v1/images/view/67adf5173d2c9b436a35c07e/1280x720/0140809604526-web-tete.jpg", title: "Ballet", sub: "Onéguine, Lac des Cygnes, Paquita" },
    { img: "https://i0.wp.com/letempsdesruptures.fr/wp-content/uploads/2025/12/7f2716df39b33e8a74e2aa710663ef91-e1764690578298.webp?fit=1175%2C1180&ssl=1", title: "Cinéma", sub: "The Substance, Queer, L'Inconnu de la Grande Arche" },
    { img: "https://www.radiofrance.fr/pikapi/images/bc7bbc48-c4b2-45e8-a3d3-c7aa8156b4b0/1200x680?webp=false", title: "Mode", sub: "Balenciaga, Gucci, Hermès" }
  ];

  return (
    <section id="about">
      <div className="inner">
        <FadeUp><h2 className="section-title"><span>Univers</span> et Sensibilités</h2></FadeUp>
        <div className="grid-cards">
          {slides.map((s, i) => (
            <FadeUp key={i} delay={i * 0.1}>
              <div className="img-zoom-container">
                <img src={s.img} className="img-zoom" alt={s.title} />
                <div className="img-overlay">
                  <h3 style={{ color: 'var(--accent)' }}>{s.title}</h3>
                  <p style={{ fontWeight: 600, color: 'var(--fg-light)', marginTop: '0.5rem' }}>{s.sub}</p>
                </div>
              </div>
            </FadeUp>
          ))}
        </div>
      </div>
    </section>
  );
}

function Experience() {
  const exps = [
    {
      company: "UNPPD",
      role: "Chargé de Communication",
      date: "Sept. 2024 au Août 2025",
      logo: "https://dentalforum2026.com/data/files/logo_unppd_2014hd.jpg",
      desc: "Gestion complète de la ligne éditoriale BtoB, croissance LinkedIn, journal mensuel et gestion de site WordPress."
    },
    {
      company: "Corporate Fiction",
      role: "Communication Commerciale",
      date: "Mai 2024 au Juin 2024",
      logo: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTCvoRKzi_I8YdIbjbPHJIMOjQs60obvHenHg&s",

  ];

  return (
    <section id="experience">

        <FadeUp><h2 className="section-title">Expériences <span>Pro</span></h2></FadeUp>
        
        <FadeUp delay={0.1}>
          <div className="hermes-highlight card-solid" style={{ marginBottom: '2rem' }}>
            <div className="tag-highlight">Expérience Phare</div>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '1.5rem', flexWrap: 'wrap', gap: '2rem' }}>
              <div style={{ display: 'flex', gap: '2rem', alignItems: 'center' }}>
                <div className="logo-box">
                  <img src="https://1000logos.net/wp-content/uploads/2017/02/Hermes-Logo.png" alt="Hermès" />
                </div>
                <div>
                  <h3>Hermès</h3>
                  <p className="role-text" style={{ fontWeight: 800 }}>Assistant Adoption et Communication Globale IT</p>
                </div>
              </div>
              <span style={{ fontWeight: 700, fontSize: '0.9rem', color: 'rgba(255,255,255,0.7)', textTransform: 'uppercase' }}>Sept. 2025 a Présent</span>
            </div>
            <p style={{ fontSize: '1.2rem', lineHeight: 1.6, maxWidth: '800px' }}>Pilotage de la refonte intégrale du SharePoint : optimisation de l'expérience utilisateur et de l'accès à
l'information, générant plus de 2 000 visites hebdomadaires.
Conception de newsletters dédiées à l'adoption des procédures et à l'identification des interlocuteurs clés
Audit, création et déploiement de nouveaux process pour structurer et fluidifier les méthodes de travail.
Participation à l’organisation d’événements, incluant la préparation du séminaire de la direction (recherches,
négociations, devis).</p>
          </div>
        </FadeUp>

        <div className="grid-cards">
          {exps.map((exp, i) => (
            <FadeUp key={exp.company} delay={i * 0.1}>
              <div className="card-solid">
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '2rem' }}>
                  <div className="logo-box">
                    <img src={exp.logo} alt={exp.company} />
                  </div>
                  <span style={{ fontWeight: 700, fontSize: '0.9rem', color: 'rgba(0,0,0,0.5)', textTransform: 'uppercase' }}>{exp.date}</span>
                </div>
                <h3>{exp.company}</h3>
                <p style={{ color: 'var(--fg-dark)', marginBottom: '1rem', fontWeight: 800 }}>{exp.role}</p>
                <p style={{ color: 'rgba(2, 44, 34, 0.8)', fontSize: '1rem' }}>{exp.desc}</p>
              </div>
            </FadeUp>
          ))}
        </div>
      </div>
    </section>
  );
}

function Projects() {
  const projs = [
    { title: "TREMPEZ", desc: "Concept fort et stratégie de bout en bout. Projet primé par la promotion.", link: "https://drive.google.com/drive/folders/14JfJ-85COCAXzQRh1tiwKy4cql7MT1qv" },
    { title: "DÉCONNEC'TUI", desc: "Offre digital detox pour les jeunes actifs en quête de sens.", link: "https://drive.google.com/drive/folders/14JfJ-85COCAXzQRh1tiwKy4cql7MT1qv" },
    { title: "ROSE FESTIVAL", desc: "Stratégie événementielle, identité visuelle et plan de diffusion.", link: "https://drive.google.com/drive/folders/14JfJ-85COCAXzQRh1tiwKy4cql7MT1qv" },

  return (
    <section id="projects">
      <div className="inner">
        <FadeUp><h2 className="section-title"><span>Mes</span> Projets</h2></FadeUp>
        <div className="grid-cards">
          {projs.map((p, i) => (
            <FadeUp key={p.title} delay={i * 0.1}>
              <div className="card-dark">
                <h3 style={{ fontFamily: "'Archivo Black', sans-serif", fontSize: '2rem', marginBottom: '1rem', color: 'var(--fg-light)' }}>{p.title}</h3>
                <p style={{ color: 'rgba(255,255,255,0.7)', lineHeight: 1.6, marginBottom: '2rem' }}>{p.desc}</p>
                <a href={p.link} target="_blank" rel="noopener noreferrer" className="btn-drive">
                  Ouvrir le PDF
                </a>
              </div>

          ))}

      </div>

function SkillsAndEducation() {
  const skillCategories = [
    {
      title: "Stratégie et Gestion",
      items: ["Positionnement de marque", "Analyse des publics et messages clés", "Coordination d'équipes", "JIRA et SharePoint"]
    },

      title: "Création et Social",

  const education = [
    { school: "ISCOM Paris", degree: "MBA Marketing, Stratégies de Marque et Publicité", date: "2026 a 2028", detail: "Rythme 4j entreprise et 1j école. Recherche alternance à partir de sept. 2026." },

  return (
    <section id="skills">

        <FadeUp><h2 className="section-title">Compétences <span>et</span> Formations</h2></FadeUp>
        
        <div style={{ marginBottom: '4rem' }}>
          <div className="grid-cards">
            {skillCategories.map((cat, i) => (
              <FadeUp key={cat.title} delay={i * 0.1}>
                <div className="card-outline">

                  <ul>

                      <li key={item} style={{ color: 'rgba(255,255,255,0.7)' }}>{item}</li>
                    ))}
                  </ul>
                </div>
              </FadeUp>
            ))}
          </div>
        </div>

        <div className="grid-cards">
          {education.map((edu, i) => (
            <FadeUp key={edu.school} delay={i * 0.1}>
               <div className="card-dark" style={{ borderStyle: 'dashed' }}>
                  <span style={{ color: 'var(--accent)', fontWeight: 700, fontSize: '0.85rem', textTransform: 'uppercase', letterSpacing: '0.1em' }}>{edu.date}</span>
                  <h3 style={{ fontFamily: "'Archivo Black', sans-serif", fontSize: '1.5rem', margin: '1rem 0', color: 'var(--fg-light)' }}>{edu.school}</h3>

               </div>
            </FadeUp>
          ))}
        </div>

      </div>
    </section>
  );
}

function Contact() {
  return (
    <section id="contact" style={{ textAlign: 'center', paddingBottom: '15vh', paddingTop: '10vh' }}>
      <div className="inner">
        <FadeUp>
          <div className="title-massive">DISONS</div>
          <div className="title-massive title-outline" style={{ marginTop: '-2rem' }}>BONJOUR</div>
        </FadeUp>
        <FadeUp delay={0.2}>
          <a href="mailto:hugo.descouts@outlook.fr" className="btn-drive" style={{ marginTop: '4rem', fontSize: '1.5rem', padding: '1.5rem 4rem' }}>
            hugo.descouts@outlook.fr
          </a>
        </FadeUp>
      </div>
    </section>
  );
}

function App() {
  return (
    <div className="page">
      <Navbar />
      <Hero />
      <Ticker />
      <Passions />
      <Experience />
      <Projects />
      <SkillsAndEducation />
      <Contact />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
