<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  :root {
    --bg: #030303;
    --fg: #ffffff;
    --muted: rgba(255,255,255,0.55);
    --border: rgba(255,255,255,0.08);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; background: var(--bg); }
  body { background: var(--bg); color: var(--fg); font-family: 'Cabinet Grotesk', sans-serif; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 5px; }
  img { display: block; max-width: 100%; }
  button { cursor: pointer; border: none; background: none; color: inherit; font-family: inherit; }
  a { color: inherit; text-decoration: none; }

  /* Bruit de fond discret */
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 999;
  }

  /* Navigation */
  #nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 1.5rem 2.5rem; display: flex; align-items: center; justify-content: space-between; transition: all 0.4s; }
  #nav.scrolled { background: rgba(3,3,3,0.9); backdrop-filter: blur(15px); padding: 1rem 2.5rem; border-bottom: 1px solid var(--border); }
  .nav-logo { font-family: 'Playfair Display', serif; font-style: italic; font-size: 1.5rem; font-weight: 900; }
  .nav-links { display: flex; gap: 2rem; }
  .nav-links a { font-size: 0.8rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; transition: color 0.3s; }
  .nav-links a:hover { color: var(--fg); }

  /* Layout */
  .page { position: relative; z-index: 1; }
  section { padding: 8vw 4vw; }
  .inner { max-width: 1200px; margin: 0 auto; }
  
  /* Typographie massive agence */
  .huge-text { font-family: 'Cabinet Grotesk', sans-serif; font-weight: 900; font-size: clamp(3.5rem, 11vw, 12rem); line-height: 0.85; text-transform: uppercase; letter-spacing: -0.03em; margin-bottom: 0.5rem; }
  .huge-text-stroke { -webkit-text-stroke: 2px rgba(255,255,255,0.3); color: transparent; }
  .section-title { font-family: 'Cabinet Grotesk', sans-serif; font-weight: 900; font-size: clamp(2.5rem, 6vw, 6rem); line-height: 0.95; letter-spacing: -0.03em; margin-bottom: 4rem; }
  .label-mono { font-family: 'DM Mono', monospace; font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin-bottom: 1.5rem; display: flex; align-items: center; gap: 1rem; }
  .label-mono::before { content: ''; width: 2rem; height: 1px; background: rgba(255,255,255,0.3); }

  /* Éléments interactifs */
  .agency-card { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 24px; transition: all 0.5s cubic-bezier(0.19,1,0.22,1); position: relative; overflow: hidden; }
  
  /* Ticker défilant infini */
  .ticker { overflow: hidden; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 1.2rem 0; background: rgba(255,255,255,0.02); }
  .ticker-track { display: flex; gap: 3rem; width: max-content; animation: scrollTicker 25s linear infinite; }
  .ticker-item { font-family: 'Cabinet Grotesk', sans-serif; font-weight: 800; font-size: 1.2rem; text-transform: uppercase; color: var(--muted); }

  /* Modale */
  .modal-ov { display: none; position: fixed; inset: 0; z-index: 500; background: rgba(0,0,0,.95); backdrop-filter: blur(20px); align-items: center; justify-content: center; padding: 1rem; }
  .modal-ov.open { display: flex; }
  .modal-box { background: #080808; border: 1px solid rgba(255,255,255,.1); border-radius: 20px; width: 100%; max-width: 1000px; height: 85vh; display: flex; flex-direction: column; overflow: hidden; }
  .m-head { padding: 1.2rem 2rem; border-bottom: 1px solid rgba(255,255,255,.08); display: flex; justify-content: space-between; align-items: center; }
  .m-ttl { font-family: 'Cabinet Grotesk', sans-serif; font-weight: 800; font-size: 1.3rem; color: var(--fg); }

  .m-close:hover { background: rgba(255,255,255,.15); }
  .m-body { flex: 1; overflow: hidden; position: relative; }
  .pdf-frame { width: 100%; height: 100%; border: none; display: none; }
  .pdf-ph { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.5rem; }
  .pdf-lbl { font-family: 'DM Mono', monospace; font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; padding: .8rem 1.8rem; border-radius: 999px; background: var(--fg); color: #000; font-weight: bold; cursor: pointer; transition: transform 0.2s; }

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// Composant d'apparition théâtrale (texte masqué qui monte)
function RevealText({ children, delay = 0 }) {
  const ref = useRef(null);
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) setVisible(true); }, { threshold: 0.1 });
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  
  return (
    <div ref={ref} style={{ overflow: 'hidden', display: 'inline-block', width: '100%' }}>
      <div style={{
        transform: visible ? 'translateY(0)' : 'translateY(110%)',
        transition: `transform 1.2s ${delay}s cubic-bezier(0.19, 1, 0.22, 1)`,
        willChange: 'transform'
      }}>
        {children}
      </div>
    </div>
  );
}

// Composant d'apparition globale (fondu vers le haut)
function FadeUp({ children, delay = 0 }) {
  const ref = useRef(null);
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) setVisible(true); }, { threshold: 0.1 });
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  
  return (
    <div ref={ref} style={{
      opacity: visible ? 1 : 0,
      transform: visible ? 'translateY(0)' : 'translateY(3rem)',
      transition: `all 1.2s ${delay}s cubic-bezier(0.19, 1, 0.22, 1)`,
    }}>
      {children}
    </div>
  );
}

            <span style={{ width: 8, height: 8, background: '#34d399', borderRadius: '50%', boxShadow: '0 0 12px #34d399' }}></span>
            Disponible Septembre 2026

        </FadeUp>
        
        <RevealText delay={0.2}>

        </RevealText>
        <RevealText delay={0.3}>

        </RevealText>
        
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))', gap: '4rem', marginTop: '4rem' }}>
          <FadeUp delay={0.4}>
            <p style={{ fontSize: 'clamp(1rem, 1.5vw, 1.2rem)', lineHeight: 1.8, color: 'var(--muted)', maxWidth: '550px' }}>
              Stratège et créatif. Futur étudiant en MBA ISCOM. J'apporte une vision audacieuse, 3 expériences solides et une exécution millimétrée pour des contenus qui performent.
            </p>
          </FadeUp>

            <div style={{ display: 'flex', gap: '3rem', flexWrap: 'wrap' }}>
              <div>
                <div style={{ fontSize: '3.5rem', fontWeight: 900 }}>3</div>
                <div className="label-mono" style={{ marginTop: '0.5rem' }}>Expériences pro</div>
              </div>
              <div>

                <div className="label-mono" style={{ marginTop: '0.5rem' }}>Projets publiés</div>
              </div>
            </div>
          </FadeUp>

    </section>

}

}

function AgencyCarousel() {

            />

}

          ))}
        </div>
      </div>
    </section>
  );
}

function Projects() {

    { id:'trempez', title:'TREMPEZ', desc:'Concept fort, storytelling soigné et stratégie de bout en bout.', color:'#e8c97a' },
    { id:'tui', title:"Déconnec'TUI", desc:'Digital detox développé pour TUI.', color:'#6ea8fe' },
    { id:'rose', title:'Rose Festival', desc:'Stratégie de communication événementielle.', color:'#f87171' },
    { id:'edu', title:'Éducation Nationale', desc:'Stratégie multicanal institutionnelle.', color:'#c4b5fd' }
  ];

  return (
    <section id="projects">
      <div className="inner">

        <RevealText>
          <h2 className="section-title">MES <span className="huge-text-stroke">PROJETS</span></h2>

        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: '1rem' }}>

                  borderRadius: '20px', padding: '2rem', cursor: 'pointer', transition: 'all 0.4s'

                onMouseOut={e => { e.currentTarget.style.borderColor = 'rgba(255,255,255,0.06)'; e.currentTarget.style.background = 'rgba(255,255,255,0.01)'; }}
              >

            Disons<br/>Bonjour.
          </div>
        </FadeUp>
        <FadeUp delay={0.2}>
          <p style={{ color: 'var(--muted)', fontSize: '1.2rem', marginBottom: '3rem' }}>Alternance 2 ans à partir de Septembre 2026</p>

function App() {
  useEffect(() => {
    window.addEventListener('scroll', () => {
      document.getElementById('nav')?.classList.toggle('scrolled', window.scrollY > 50);

  return (

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<script>
function oMenu(){document.getElementById('mMenu').classList.add('open');document.body.style.overflow='hidden'}
function cMenu(){document.getElementById('mMenu').classList.remove('open');document.body.style.overflow=''}

let curId = '';
function oModal(title) {
  document.getElementById('mTtl').textContent = title;
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function cModal() { 
  document.getElementById('modal').classList.remove('open'); 
  document.body.style.overflow = ''; 
}
function loadPdf(input) {
  const file = input.files[0]; if (!file) return;
  const url = URL.createObjectURL(file);
  const frame = document.getElementById('pdfFrame');
  frame.src = url; 
  frame.style.display = 'block';
  document.getElementById('pdfPh').style.display = 'none';
}
document.getElementById('modal').addEventListener('click', function(e) { if (e.target === this) cModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') cModal(); });
</script>
</body>
