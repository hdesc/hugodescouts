const { useState, useEffect, useRef } = React;

function RevealText({ children, delay = 0 }) {
  const ref = useRef(null);
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) setVisible(true); }, { threshold: 0.1 });
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  
  return (
    <div ref={ref} style={{ overflow: 'hidden', width: '100%' }}>
      <div style={{
        transform: visible ? 'translateY(0)' : 'translateY(100%)',
        transition: `transform 1.2s ${delay}s cubic-bezier(0.19, 1, 0.22, 1)`,
      }}>
        {children}
      </div>
    </div>
  );
}

function FadeUp({ children, delay = 0 }) {
  const ref = useRef(null);
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) setVisible(true); }, { threshold: 0.1 });
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  
  return (
    <div ref={ref} style={{
      opacity: visible ? 1 : 0,
      transform: visible ? 'translateY(0)' : 'translateY(3rem)',
      transition: `all 1s ${delay}s cubic-bezier(0.19, 1, 0.22, 1)`,
    }}>
      {children}
    </div>
  );
}

<script>
let curId = '';
function oModal(title) {
  document.getElementById('mTtl').textContent = title;
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function cModal() { 
  document.getElementById('modal').classList.remove('open'); 
  document.body.style.overflow = ''; 
}
function loadPdf(input) {
  const file = input.files[0]; if (!file) return;
  const url = URL.createObjectURL(file);
  const frame = document.getElementById('pdfFrame');
  frame.src = url; 
  frame.style.display = 'block';
  document.getElementById('pdfPh').style.display = 'none';
}
document.getElementById('modal').addEventListener('click', function(e) { if (e.target === this) cModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') cModal(); });
</script>
