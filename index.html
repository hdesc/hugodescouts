<style>
  :root {
    --bg: #080810;
    --fg: #f5f4f0;
    --muted: rgba(245,244,240,.45);
    --border: rgba(245,244,240,.08);
    --gold: #e8c97a;
    --blue: #6ea8fe;
    --rose: #f87171;

  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--fg); font-family: 'Cabinet Grotesk', sans-serif; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: rgba(196,181,253,.4); border-radius: 2px; }
  img { display: block; max-width: 100%; }
  button { cursor: pointer; border: none; background: none; color: inherit; font-family: inherit; }
  a { color: inherit; text-decoration: none; }

  /* Grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 999;
    opacity: .5;
  }

  /* Orbs */
  .orbs { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .orb { position: absolute; border-radius: 50%; filter: blur(80px); }
  .o1 { width: min(700px,80vw); height: min(700px,80vw); top: -15%; right: -10%;
    background: radial-gradient(circle, rgba(110,168,254,.18) 0%, rgba(196,181,253,.08) 50%, transparent 70%);
    animation: oa 16s ease-in-out infinite; }
  .o2 { width: min(600px,70vw); height: min(600px,70vw); bottom: -5%; left: -10%;
    background: radial-gradient(circle, rgba(248,113,113,.14) 0%, rgba(236,72,153,.06) 50%, transparent 70%);
    animation: ob 21s ease-in-out infinite; }
  .o3 { width: min(450px,55vw); height: min(450px,55vw); top: 38%; left: 28%;
    background: radial-gradient(circle, rgba(52,211,153,.1) 0%, rgba(6,182,212,.05) 50%, transparent 70%);

  @keyframes oa { 0%,100%{transform:translate(0,0)} 33%{transform:translate(-3%,5%)} 66%{transform:translate(3%,-3%)} }
  @keyframes ob { 0%,100%{transform:translate(0,0)} 50%{transform:translate(5%,-6%)} }
  @keyframes oc { 0%,100%{transform:translate(0,0)} 40%{transform:translate(-4%,4%)} 80%{transform:translate(4%,-3%)} }

  /* Fade in animations */
  @keyframes fadeUp { from { opacity:0; transform:translateY(2.5rem); } to { opacity:1; transform:none; } }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  @keyframes shimmer { 0%{background-position:0%} 100%{background-position:200%} }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  @keyframes wobble { 0%,100%{transform:rotate(-8deg)} 50%{transform:rotate(8deg)} }
  @keyframes scrollTicker { from{transform:translateX(0)} to{transform:translateX(-50%)} }

  .anim-up { animation: fadeUp .9s cubic-bezier(.19,1,.22,1) both; }
  .anim-in { animation: fadeIn .8s ease both; }

  /* Nav */
  #nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 1.1rem clamp(1.2rem,4vw,2.5rem);
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    transition: background .4s, border-color .4s; }
  #nav.scrolled { background: rgba(8,8,16,.88); backdrop-filter: blur(24px); border-bottom: 1px solid var(--border); }

  .nav-links { display: flex; gap: 1.5rem; align-items: center; }
  .nav-links a { font-size: .82rem; font-weight: 500; color: var(--muted); transition: color .25s; white-space: nowrap; }
  .nav-links a:hover { color: var(--fg); }
  .lang-pill { display: flex; background: rgba(245,244,240,.07); border-radius: 999px; padding: .14rem; gap: .08rem; }
  .lb { font-family: 'DM Mono', monospace; font-size: .58rem; letter-spacing: .1em; text-transform: uppercase;

  .hbg { display: none; font-size: 1.5rem; padding: .25rem; }
  .mob-menu { display: none; position: fixed; inset: 0; background: rgba(8,8,16,.97); backdrop-filter: blur(24px);

  section { padding: clamp(4.5rem,9vw,8rem) clamp(1.2rem,4vw,3rem); }
  .inner { max-width: 1100px; margin: 0 auto; }
  .lbl { font-family: 'DM Mono', monospace; font-size: .6rem; letter-spacing: .28em; text-transform: uppercase;

  .dv { height: 1px; border: none; margin-bottom: clamp(3rem,5vw,5rem); }
  .dv-v { background: linear-gradient(to right, transparent, rgba(196,181,253,.45), rgba(110,168,254,.3), transparent); }
  .dv-e { background: linear-gradient(to right, transparent, rgba(52,211,153,.45), rgba(6,182,212,.3), transparent); }
  .dv-r { background: linear-gradient(to right, transparent, rgba(248,113,113,.45), rgba(236,72,153,.3), transparent); }
  .dv-g { background: linear-gradient(to right, transparent, rgba(232,201,122,.45), rgba(245,158,11,.3), transparent); }

  /* Glass */
  .glass { background: rgba(245,244,240,.04); border: 1px solid var(--border); border-radius: 20px; backdrop-filter: blur(12px); transition: background .3s, border-color .3s; }
  .glass:hover { background: rgba(245,244,240,.07); border-color: rgba(245,244,240,.14); }

  /* Modal */
  .modal-ov { display: none; position: fixed; inset: 0; z-index: 500; background: rgba(0,0,0,.9); backdrop-filter: blur(20px); align-items: center; justify-content: center; padding: 1rem; }
  .modal-ov.open { display: flex; }
  .modal-box { background: rgba(10,10,20,.97); border: 1px solid rgba(245,244,240,.1); border-radius: 20px; width: 100%; max-width: 920px; height: 88vh; display: flex; flex-direction: column; overflow: hidden; }
  .m-head { padding: 1.1rem 1.6rem; border-bottom: 1px solid rgba(245,244,240,.08); display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-shrink: 0; }
  .m-stag { font-family: 'DM Mono', monospace; font-size: .54rem; letter-spacing: .14em; text-transform: uppercase; margin-bottom: .22rem; }
  .m-ttl { font-family: 'Cabinet Grotesk', sans-serif; font-weight: 800; font-size: 1.15rem; color: var(--fg); }
  .m-close { background: rgba(245,244,240,.07); border: 1px solid rgba(245,244,240,.1); border-radius: 999px; padding: .3rem .85rem; color: var(--muted); font-family: 'DM Mono', monospace; font-size: .58rem; transition: all .2s; }
  .m-close:hover { background: rgba(245,244,240,.13); color: var(--fg); }
  .m-body { flex: 1; overflow: hidden; }
  .pdf-ph { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.1rem; }
  .pdf-ph p { font-size: .88rem; color: rgba(245,244,240,.3); text-align: center; line-height: 1.85; }

  @media(max-width:480px) {
    .mob-menu a { font-size: 2rem; }

</style>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ── useInView ──
function useInView(threshold = 0.1) {
  const ref = useRef(null);
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) setVisible(true); }, { threshold });
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return [ref, visible];
}

// ── Reveal wrapper ──
function Reveal({ children, delay = 0, style = {} }) {
  const [ref, visible] = useInView(0.08);
  return (
    <div ref={ref} style={{
      opacity: visible ? 1 : 0,
      transform: visible ? 'none' : 'translateY(2rem)',
      transition: `opacity .9s ${delay}s ease, transform .9s ${delay}s cubic-bezier(.19,1,.22,1)`,
      ...style
    }}>
      {children}
    </div>
  );
}

// ── Gradient orbs ──
function Orbs() {
  return (
    <div style={{ position:'fixed', inset:0, pointerEvents:'none', zIndex:0, overflow:'hidden' }}>
      <style>{`
        @keyframes oa{0%,100%{transform:translate(0,0)}33%{transform:translate(-3%,5%)}66%{transform:translate(3%,-3%)}}
        @keyframes ob{0%,100%{transform:translate(0,0)}50%{transform:translate(5%,-6%)}}
        @keyframes oc{0%,100%{transform:translate(0,0)}40%{transform:translate(-4%,4%)}80%{transform:translate(4%,-3%)}}
      `}</style>
      {[
        { style:{ width:'min(700px,80vw)', height:'min(700px,80vw)', top:'-15%', right:'-10%', background:'radial-gradient(circle,rgba(110,168,254,.18) 0%,rgba(196,181,253,.08) 50%,transparent 70%)', animation:'oa 16s ease-in-out infinite' }},
        { style:{ width:'min(600px,70vw)', height:'min(600px,70vw)', bottom:'-5%', left:'-10%', background:'radial-gradient(circle,rgba(248,113,113,.14) 0%,rgba(236,72,153,.06) 50%,transparent 70%)', animation:'ob 21s ease-in-out infinite' }},
        { style:{ width:'min(450px,55vw)', height:'min(450px,55vw)', top:'38%', left:'28%', background:'radial-gradient(circle,rgba(52,211,153,.1) 0%,rgba(6,182,212,.05) 50%,transparent 70%)', animation:'oc 26s ease-in-out infinite' }},
      ].map((o,i) => (
        <div key={i} style={{ position:'absolute', borderRadius:'50%', filter:'blur(80px)', ...o.style }} />
      ))}
    </div>
  );
}

// ── Ticker ──
function Ticker() {
  const items = ['Communication stratégique','Création de contenu','Marketing digital','Hermès','LinkedIn','Événementiel','Design graphique','Stratégie de marque','Adobe Suite','MBA ISCOM'];
  const doubled = [...items, ...items];
  return (
    <div className="ticker">
      <div className="ticker-track">
        {doubled.map((item, i) => (
          <span key={i} className="ticker-item">
            {item} <span className="ticker-dot">◆</span>{' '}
          </span>
        ))}
      </div>
    </div>
  );
}

// ── Hero ──
function Hero({ lang }) {
  const [loaded, setLoaded] = useState(false);
  useEffect(() => { setTimeout(() => setLoaded(true), 80); }, []);
  const anim = (d) => ({
    opacity: loaded ? 1 : 0,
    transform: loaded ? 'none' : 'translateY(2.5rem)',
    transition: `opacity 1s ${d}s ease, transform 1s ${d}s cubic-bezier(.19,1,.22,1)`,
  });
  return (
    <section id="proposition" style={{ minHeight:'100vh', display:'flex', flexDirection:'column', justifyContent:'center', paddingTop:'7rem', position:'relative', zIndex:1 }}>
      <div className="inner">
        {/* Overline */}
        <div style={{ ...anim(.1), display:'flex', alignItems:'center', gap:'.6rem', marginBottom:'2rem', flexWrap:'wrap' }}>
          <span style={{ display:'inline-flex', alignItems:'center', gap:'.45rem', fontFamily:"'DM Mono',monospace", fontSize:'.62rem', letterSpacing:'.18em', textTransform:'uppercase', color:'rgba(245,244,240,.45)' }}>
            <span style={{ width:7, height:7, borderRadius:'50%', background:'#34d399', boxShadow:'0 0 10px #34d399', animation:'pulse 2s infinite', flexShrink:0 }} />
            {lang === 'fr' ? 'Disponible sept. 2026' : 'Available Sept. 2026'}
          </span>
          <span style={{ color:'rgba(245,244,240,.15)', fontFamily:'monospace' }}>·</span>
          <span style={{ fontFamily:"'DM Mono',monospace", fontSize:'.62rem', letterSpacing:'.18em', textTransform:'uppercase', color:'rgba(245,244,240,.3)' }}>
            MBA ISCOM Paris
          </span>
        </div>

        {/* Big question */}
        <div style={{ ...anim(.15), overflow:'hidden' }}>
          <h1 style={{
            fontFamily:"'Cabinet Grotesk',sans-serif", fontWeight:800,
            fontSize:'clamp(.95rem,2.2vw,1.3rem)', letterSpacing:'.12em', textTransform:'uppercase',
            color:'rgba(245,244,240,.35)', marginBottom:'1rem'
          }}>
            {lang === 'fr' ? 'Et si j\'étais votre prochain alternant ?' : 'What if I were your next work-study hire?'}
          </h1>
        </div>

        <div style={{ ...anim(.2) }}>
          <h2 style={{
            fontFamily:"'Cabinet Grotesk',sans-serif", fontWeight:800,
            fontSize:'clamp(3rem,10vw,9.5rem)', lineHeight:.88, letterSpacing:'-.03em',
            color:'var(--fg)', marginBottom:'2.5rem'
          }}>
            HUGO<br/>
            <span style={{ WebkitTextStroke:'1.5px rgba(245,244,240,.22)', color:'transparent' }}>DESCOUTS</span>
          </h2>
        </div>

        <div style={{ ...anim(.3), display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(min(100%,380px),1fr))', gap:'2rem', alignItems:'start' }}>
          <p style={{ fontSize:'clamp(.95rem,1.5vw,1.1rem)', color:'rgba(245,244,240,.52)', fontWeight:300, lineHeight:1.82, maxWidth:520 }}>
            {lang === 'fr'
              ? "Stratège et créatif, j'apporte avec moi 3 expériences professionnelles solides dont une chez Hermès, une maîtrise des outils du marketing digital et une capacité prouvée à produire du contenu qui génère des résultats."
              : "Strategic and creative, I bring 3 solid professional experiences including one at Hermès, a mastery of digital marketing tools, and a proven ability to produce content that drives results."
            }
          </p>
          <div style={{ display:'flex', gap:'clamp(2rem,4vw,4rem)', flexWrap:'wrap' }}>
            {[
              { n:'3', l: lang === 'fr' ? 'Expériences pro' : 'Pro experiences' },
              { n:'4', l: lang === 'fr' ? 'Projets publiés' : 'Published projects' },
              { n:'2', l: lang === 'fr' ? 'Alternances' : 'Work-studies' },
            ].map(({ n, l }) => (
              <div key={l}>
                <div style={{ fontFamily:"'Cabinet Grotesk',sans-serif", fontWeight:800, fontSize:'clamp(2.5rem,5vw,4rem)', color:'var(--fg)', lineHeight:1 }}>{n}</div>
                <div style={{ fontFamily:"'DM Mono',monospace", fontSize:'.55rem', letterSpacing:'.15em', color:'rgba(245,244,240,.3)', textTransform:'uppercase', marginTop:'.35rem' }}>{l}</div>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* Scroll hint */}
      <div style={{ ...anim(.6), position:'absolute', bottom:'2.5rem', left:'50%', transform:'translateX(-50%)', display:'flex', flexDirection:'column', alignItems:'center', gap:'.4rem' }}>
        <span style={{ fontFamily:"'DM Mono',monospace", fontSize:'.55rem', letterSpacing:'.2em', textTransform:'uppercase', color:'rgba(245,244,240,.25)' }}>scroll</span>
        <div style={{ width:1, height:30, background:'linear-gradient(to bottom, rgba(245,244,240,.3), transparent)' }} />
      </div>

      <style>{`@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}`}</style>
    </section>
  );
}

// ── Passion Carousel ──
function PassionCarousel({ lang }) {
  const [cur, setCur] = useState(0);
  const slides = [
    {
      img: 'https://images.unsplash.com/photo-1518834107812-67b0b7c58434?w=1200&q=80&fit=crop&crop=center',
      label: 'BALLET & OPÉRA',
      sub: lang === 'fr' ? 'Onéguine · Lac des Cygnes · Paquita' : 'Onegin · Swan Lake · Paquita',
    },
    {
      img: 'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=1200&q=80&fit=crop&crop=center',
      label: 'CINÉMA',
      sub: lang === 'fr' ? 'The Substance · Queer · L\'Inconnu de la Grande Arche' : 'The Substance · Queer · L\'Inconnu de la Grande Arche',
    },
    {
      img: 'https://images.unsplash.com/photo-1469334031218-e382a71b716b?w=1200&q=80&fit=crop&crop=center',
      label: 'MODE',
      sub: 'Balenciaga · Gucci · Hermès',
    },
  ];
  const total = slides.length;

  useEffect(() => {
    const t = setInterval(() => setCur(c => (c + 1) % total), 4500);
    return () => clearInterval(t);
  }, []);

  return (
    <div style={{ position:'relative', borderRadius:20, overflow:'hidden', height:'clamp(300px,48vw,480px)' }}>
      {slides.map((s, i) => (
        <div key={i} style={{
          position:'absolute', inset:0,
          opacity: i === cur ? 1 : 0,
          transition:'opacity .9s cubic-bezier(.77,0,.175,1)',
        }}>
          <img src={s.img} alt={s.label} style={{ width:'100%', height:'100%', objectFit:'cover', filter:'brightness(.52)' }} />
          <div style={{ position:'absolute', inset:0, background:'linear-gradient(to top, rgba(8,8,16,.88) 0%, rgba(8,8,16,.1) 55%, transparent 100%)' }} />
          <div style={{ position:'absolute', bottom:0, left:0, right:0, padding:'2rem 2.2rem' }}>
            <div style={{ fontFamily:"'DM Mono',monospace", fontSize:'.58rem', letterSpacing:'.25em', textTransform:'uppercase', color:'rgba(245,244,240,.5)', marginBottom:'.5rem' }}>
              {lang === 'fr' ? 'Passion' : 'Passion'}
            </div>

<script>
// Nav / menus (outside React)
function oMenu(){document.getElementById('mMenu').classList.add('open');document.body.style.overflow='hidden'}
function cMenu(){document.getElementById('mMenu').classList.remove('open');document.body.style.overflow=''}

// PDF Modal
const pdfStore = {};
let curId = '';
const meta = {
  trempez:{ tag:'Projet primé', ttl:'TREMPEZ', color:'#e8c97a', grad:'linear-gradient(135deg,#e8c97a,#c9a84c)' },
  tui:{ tag:'Projet primé', ttl:"Déconnec'TUI", color:'#6ea8fe', grad:'linear-gradient(135deg,#6ea8fe,#818cf8)' },
  rose:{ tag:'Projet', ttl:'Rose Festival', color:'#f87171', grad:'linear-gradient(135deg,#f87171,#ec4899)' },
  edu:{ tag:'Projet', ttl:"Ministère de l'Éducation Nationale", color:'#c4b5fd', grad:'linear-gradient(135deg,#c4b5fd,#818cf8)' },
};
function oModal(id) {
  curId = id;
  const m = meta[id];
  document.getElementById('mTag').textContent = m.tag;
  document.getElementById('mTag').style.color = m.color;
  document.getElementById('mTtl').textContent = m.ttl;
  document.getElementById('pdfLbl').style.background = m.grad;
  const frame = document.getElementById('pdfFrame'), ph = document.getElementById('pdfPh');
  if (pdfStore[id]) { frame.src = pdfStore[id]; frame.style.display = 'block'; ph.style.display = 'none'; }
  else { frame.src = ''; frame.style.display = 'none'; ph.style.display = 'flex'; document.getElementById('pdfInp').value = ''; }
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function cModal() { document.getElementById('modal').classList.remove('open'); document.body.style.overflow = ''; }
function loadPdf(input) {
  const file = input.files[0]; if (!file) return;
  const url = URL.createObjectURL(file);
  pdfStore[curId] = url;
  const frame = document.getElementById('pdfFrame');
  frame.src = url; frame.style.display = 'block';
  document.getElementById('pdfPh').style.display = 'none';
}
document.getElementById('modal').addEventListener('click', function(e) { if (e.target === this) cModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') cModal(); });
</script>
