<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Hugo Descouts — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

<style>
/* ─── TOKENS ─── */
:root {
  --bg:     #05130b;
  --bg1:    #081a10;
  --bg2:    #0b2016;
  --fg:     #ffffff;
  --g:      #34d399;
  --g2:     #10b981;
  --g3:     #059669;
  --glow:   rgba(52,211,153,.18);
  --m:      rgba(255,255,255,.55);
  --border: rgba(52,211,153,.18);
  --dark:   #022c22;
}

/* ─── RESET ─── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; background: var(--bg); }
body { background: var(--bg); color: var(--fg); font-family: 'Space Grotesk', sans-serif; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
img { display: block; max-width: 100%; }
button { cursor: pointer; border: none; background: none; color: inherit; font-family: inherit; }
a { color: inherit; text-decoration: none; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--g2); border-radius: 3px; }

/* ─── ANIMATED BACKGROUND ─── */
.bg-scene {
  position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
}

/* Grid */
.bg-grid {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(52,211,153,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(52,211,153,.04) 1px, transparent 1px);
  background-size: 60px 60px;
  mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 100%);
}

/* Orbs */
.orb {
  position: absolute; border-radius: 50%; filter: blur(100px);
}
.orb-1 {
  width: 50vw; height: 50vw; top: -15%; left: -10%;
  background: radial-gradient(circle, rgba(16,185,129,.12) 0%, transparent 70%);
  animation: drift1 18s ease-in-out infinite;
}
.orb-2 {
  width: 40vw; height: 40vw; bottom: 10%; right: -10%;
  background: radial-gradient(circle, rgba(5,150,105,.1) 0%, transparent 70%);
  animation: drift2 22s ease-in-out infinite;
}
.orb-3 {
  width: 30vw; height: 30vw; top: 40%; left: 50%;
  background: radial-gradient(circle, rgba(52,211,153,.07) 0%, transparent 70%);
  animation: drift3 15s ease-in-out infinite;
}

@keyframes drift1 { 0%,100%{transform:translate(0,0)} 33%{transform:translate(4%,6%)} 66%{transform:translate(-3%,3%)} }
@keyframes drift2 { 0%,100%{transform:translate(0,0)} 33%{transform:translate(-5%,-4%)} 66%{transform:translate(3%,-6%)} }
@keyframes drift3 { 0%,100%{transform:translate(-50%,0)} 50%{transform:translate(-50%,5%)} }

/* Scanlines */
.scanlines {
  position: absolute; inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,.03) 2px,
    rgba(0,0,0,.03) 4px
  );
  pointer-events: none;
}

/* Noise */
.noise {
  position: absolute; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  opacity: .6;
}

/* ─── NAV ─── */
#nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 500;
  padding: 1.4rem clamp(1.5rem,4vw,3rem);
  display: flex; align-items: center; justify-content: space-between;
  transition: background .4s, border-color .4s;
}
#nav.sc {
  background: rgba(5,19,11,.95);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
}
.n-logo {
  font-family: 'Archivo Black', sans-serif;
  font-size: 1.8rem; color: var(--g); letter-spacing: .02em;
}
.n-links { display: flex; gap: 2.5rem; align-items: center; }
.n-links a {
  font-weight: 700; font-size: .8rem; text-transform: uppercase;
  letter-spacing: .12em; color: var(--m); transition: color .25s;
}
.n-links a:hover { color: var(--g); }
.hbg { display: none; font-size: 1.5rem; color: var(--fg); }

/* ─── MOBILE MENU ─── */
.mob {
  display: none; position: fixed; inset: 0; background: var(--bg);
  z-index: 600; flex-direction: column; justify-content: flex-end;
  padding: clamp(3rem,7vw,5rem); gap: 1.4rem;
}
.mob.open { display: flex; }
.mob a {
  font-family: 'Archivo Black', sans-serif;
  font-size: clamp(2.5rem,8vw,5rem); color: var(--fg);
  line-height: 1.1; border-bottom: 1px solid var(--border);
  padding-bottom: .4rem; transition: color .3s;
}
.mob a:hover { color: var(--g); }
.mob-x { position: absolute; top: 1.8rem; right: 2rem; font-size: 1.8rem; color: var(--m); }

/* ─── PAGE ─── */
.page { position: relative; z-index: 1; }
section { padding: clamp(5rem,10vw,9rem) clamp(1.5rem,5vw,4rem); }
.inner { max-width: 1400px; margin: 0 auto; }

/* ─── REVEAL ─── */
.reveal { opacity: 0; transform: translateY(36px); transition: opacity 1s ease, transform 1s cubic-bezier(.19,1,.22,1); }
.reveal.visible { opacity: 1; transform: none; }

/* ─── TYPOGRAPHY ─── */
.big { font-family: 'Archivo Black', sans-serif; font-size: clamp(4rem,13vw,15rem); line-height: .85; text-transform: uppercase; letter-spacing: -.04em; }
.big-o { -webkit-text-stroke: 2px rgba(255,255,255,.3); color: transparent; }
.sec-h { font-family: 'Archivo Black', sans-serif; font-size: clamp(2.5rem,7vw,7rem); line-height: .9; text-transform: uppercase; margin-bottom: 3.5rem; }
.sec-h span { -webkit-text-stroke: 2px rgba(255,255,255,.28); color: transparent; }
.label { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .22em; color: var(--g); margin-bottom: 1rem; display: flex; align-items: center; gap: .7rem; }
.label::before { content: ''; width: 2rem; height: 1.5px; background: var(--g); }

/* ─── BADGE ─── */
.badge {
  display: inline-flex; align-items: center; gap: .8rem;
  background: rgba(52,211,153,.08); border: 1px solid var(--border);
  border-radius: 999px; padding: .55rem 1.4rem;
  font-weight: 700; font-size: .75rem; text-transform: uppercase;
  letter-spacing: .12em; color: var(--g); margin-bottom: 2.5rem;
}
.dot { width: 8px; height: 8px; background: var(--g); border-radius: 50%; box-shadow: 0 0 8px var(--g); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }

/* ─── TICKER ─── */
.ticker {
  overflow: hidden; background: var(--fg); padding: 1.3rem 0;
  transform: rotate(-1.5deg) scale(1.04);
  margin: 3rem 0; box-shadow: 0 12px 40px rgba(0,0,0,.6);
  position: relative; z-index: 2;
}
.tk-track { display: flex; width: max-content; animation: tk 22s linear infinite; }
@keyframes tk { from { transform: translateX(0); } to { transform: translateX(-50%); } }
.tk-item { font-family: 'Archivo Black', sans-serif; font-size: 2.2rem; color: var(--dark); white-space: nowrap; padding: 0 2rem; text-transform: uppercase; }
.tk-sep { color: var(--g2); margin: 0 1.5rem; }

/* ─── HERO ─── */
#hero { min-height: 100svh; display: flex; flex-direction: column; justify-content: flex-end; padding-top: 9rem; border-bottom: 1px solid var(--border); }
.hero-bottom { display: grid; grid-template-columns: 1fr auto; align-items: flex-end; gap: 2rem; margin-top: clamp(3rem,5vw,5rem); padding-bottom: clamp(3rem,5vw,5rem); }
.hero-desc { font-size: clamp(1rem,1.5vw,1.2rem); color: var(--m); line-height: 1.8; max-width: 540px; }
.hero-stats { display: flex; gap: clamp(2rem,4vw,4rem); flex-wrap: wrap; justify-content: flex-end; }
.s-n { font-family: 'Archivo Black', sans-serif; font-size: clamp(3rem,6vw,5rem); color: var(--g); line-height: 1; }
.s-l { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--m); margin-top: .35rem; }

/* ─── PASSIONS ─── */
.pp-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 0; border: 1px solid var(--border); border-radius: 20px; overflow: hidden; }
.pp { position: relative; overflow: hidden; aspect-ratio: 2/3; }
.pp img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(80%) brightness(.7); transition: transform .9s cubic-bezier(.19,1,.22,1), filter .7s; display: block; }
.pp:hover img { transform: scale(1.07); filter: grayscale(0%) brightness(.8); }
.pp-ov { position: absolute; inset: 0; background: linear-gradient(to top, rgba(5,19,11,.92) 0%, transparent 55%); }
.pp-lbl { position: absolute; bottom: 0; left: 0; right: 0; padding: clamp(1.5rem,3vw,2.5rem); }
.pp-cat { font-size: .62rem; font-weight: 700; letter-spacing: .28em; text-transform: uppercase; color: var(--g); margin-bottom: .5rem; }
.pp-title { font-family: 'Archivo Black', sans-serif; font-size: clamp(2rem,4.5vw,3.8rem); color: #fff; line-height: 1; text-transform: uppercase; }
.pp-sub { font-size: .72rem; color: rgba(255,255,255,.4); margin-top: .4rem; font-weight: 600; }
.pp:not(:last-child) { border-right: 1px solid var(--border); }

/* ─── HERMÈS SECTION ─── */
#hermes {
  padding: 0; position: relative; min-height: 90vh;
  display: flex; align-items: flex-end; overflow: hidden;
}
.hm-bg {
  position: absolute; inset: 0;
  background: linear-gradient(135deg, #081a0d 0%, #0f2e18 40%, #081a0d 100%);
}
.hm-img {
  position: absolute; inset: 0;
  background-image: url('https://images.unsplash.com/photo-1614026480218-ac0088d5aabb?w=1600&q=80&fit=crop&crop=center');
  background-size: cover; background-position: center;
  opacity: .06; mix-blend-mode: luminosity;
}
.hm-glow { position: absolute; inset: 0; background: radial-gradient(ellipse 70% 70% at 60% 30%, rgba(52,211,153,.08) 0%, transparent 65%); }
/* animated vertical lines */
.hm-lines { position: absolute; inset: 0; pointer-events: none; }
.hm-line {
  position: absolute; top: 0; bottom: 0; width: 1px;
  background: linear-gradient(to bottom, transparent, rgba(52,211,153,.12), transparent);
}
.hm-content {
  position: relative; z-index: 2; width: 100%; max-width: 1400px; margin: 0 auto;
  padding: clamp(5rem,9vw,8rem) clamp(1.5rem,5vw,4rem);
}
.hm-tag {
  display: inline-flex; align-items: center; gap: .7rem;
  background: rgba(52,211,153,.1); border: 1px solid rgba(52,211,153,.3);
  border-radius: 999px; padding: .4rem 1.2rem;
  font-size: .65rem; font-weight: 700; letter-spacing: .2em;
  text-transform: uppercase; color: var(--g); margin-bottom: 2.5rem;
}
.hm-top { display: flex; align-items: center; gap: 2rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
.hm-logo {
  width: clamp(80px,9vw,110px); height: clamp(80px,9vw,110px);
  background: #fff; border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  padding: 14px; box-shadow: 0 0 60px rgba(52,211,153,.18);
  flex-shrink: 0;
}
.hm-logo img { max-width: 100%; max-height: 100%; object-fit: contain; }
.hm-name {
  font-family: 'Archivo Black', sans-serif;
  font-size: clamp(4rem,11vw,10rem); color: var(--g);
  line-height: .9; letter-spacing: -.02em;
  text-shadow: 0 0 80px rgba(52,211,153,.2);
}
.hm-role { font-size: .8rem; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; color: rgba(52,211,153,.65); margin-bottom: 1rem; }
.hm-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%,400px), 1fr)); gap: 4rem; align-items: start; margin-top: 2.5rem; }
/* Bullets */
.hm-missions { list-style: none; display: flex; flex-direction: column; gap: .85rem; }
.hm-missions li { display: flex; gap: 1rem; font-size: clamp(.88rem,1.2vw,1.02rem); color: rgba(255,255,255,.58); line-height: 1.72; }
.hm-missions li::before { content: '◆'; color: var(--g); font-size: .45rem; margin-top: .38rem; flex-shrink: 0; }
.hm-chips { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1.8rem; }
.hm-chip { font-size: .62rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: .3rem .9rem; border-radius: 3px; border: 1px solid rgba(52,211,153,.3); color: var(--g); }
/* KPIs */
.hm-kpis { display: flex; flex-direction: column; gap: 1.5rem; }
.hm-kpi { display: flex; align-items: baseline; gap: 1.2rem; padding: 1.5rem 2rem; background: rgba(52,211,153,.05); border: 1px solid rgba(52,211,153,.12); border-radius: 12px; transition: background .3s; }
.hm-kpi:hover { background: rgba(52,211,153,.1); }
.hm-kpi-n { font-family: 'Archivo Black', sans-serif; font-size: clamp(2rem,4.5vw,3.5rem); color: var(--g); line-height: 1; white-space: nowrap; }
.hm-kpi-l { font-size: .72rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: rgba(52,211,153,.55); }

/* ─── OTHER XP ─── */
#experience { background: var(--bg1); }
.xp-i { border-bottom: 1px solid var(--border); padding: clamp(2rem,4vw,3.5rem) 0; cursor: pointer; transition: padding .35s; }
.xp-i:first-child { border-top: 1px solid var(--border); }
.xp-i:hover { padding-left: .8rem; }
.xp-row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: clamp(1.5rem,3vw,3rem); }
.xp-logo { width: clamp(52px,6vw,68px); height: clamp(52px,6vw,68px); background: #fff; border-radius: 10px; display: flex; align-items: center; justify-content: center; padding: 8px; flex-shrink: 0; overflow: hidden; border: 1px solid rgba(255,255,255,.1); }
.xp-logo img { max-width: 100%; max-height: 100%; object-fit: contain; }
.xp-co { font-family: 'Archivo Black', sans-serif; font-size: clamp(2rem,5vw,4rem); line-height: 1; color: var(--fg); transition: color .3s; text-transform: uppercase; }
.xp-i:hover .xp-co, .xp-i.open .xp-co { color: var(--g); }
.xp-role { font-size: clamp(.8rem,1.1vw,.95rem); color: var(--m); margin-top: .3rem; }
.xp-bdg { font-size: .56rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; padding: .18rem .55rem; border-radius: 3px; border: 1px solid; display: inline-block; margin-bottom: .4rem; }
.alt { color: var(--g); border-color: rgba(52,211,153,.3); }
.stg { color: #f59e0b; border-color: rgba(245,158,11,.3); }
.xp-date { font-size: .65rem; font-weight: 600; letter-spacing: .12em; color: var(--m); text-transform: uppercase; white-space: nowrap; }
.xp-plus { font-size: 2rem; color: var(--border); transition: transform .4s, color .3s; line-height: 1; }
.xp-i:hover .xp-plus, .xp-i.open .xp-plus { color: var(--g); }
.xp-i.open .xp-plus { transform: rotate(45deg); }
.xp-body { max-height: 0; overflow: hidden; transition: max-height .6s cubic-bezier(.19,1,.22,1); }
.xp-body.open { max-height: 600px; }
.xp-inn { padding: 2rem 0 .5rem calc(clamp(52px,6vw,68px) + clamp(1.5rem,3vw,3rem)); border-top: 1px solid var(--border); margin-top: 1rem; }
.xp-ul { list-style: none; display: flex; flex-direction: column; gap: .8rem; margin-bottom: 1.4rem; }
.xp-ul li { font-size: clamp(.88rem,1.1vw,1rem); color: var(--m); line-height: 1.7; display: flex; gap: 1rem; }
.xp-ul li::before { content: '→'; color: var(--g); flex-shrink: 0; }
.chips { display: flex; flex-wrap: wrap; gap: .5rem; }
.chip { font-size: .62rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: .3rem .85rem; border-radius: 3px; border: 1px solid var(--border); color: var(--m); }

/* ─── PROJECTS ─── */
#projects { background: var(--bg2); }
.pj-grid { display: grid; grid-template-columns: repeat(2,1fr); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; }
.pj { padding: clamp(2rem,4vw,3.5rem); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); cursor: pointer; position: relative; overflow: hidden; min-height: clamp(260px,22vw,340px); display: flex; flex-direction: column; justify-content: space-between; transition: background .4s; }
.pj:hover { background: rgba(52,211,153,.04); }
.pj:nth-child(2n) { border-right: none; }
.pj:nth-child(3), .pj:nth-child(4) { border-bottom: none; }
.pj-glow { position: absolute; width: 300px; height: 300px; border-radius: 50%; top: -40%; right: -20%; background: radial-gradient(circle, rgba(52,211,153,.07) 0%, transparent 70%); pointer-events: none; opacity: 0; transition: opacity .4s; }
.pj:hover .pj-glow { opacity: 1; }
.pj-num { font-size: .68rem; font-weight: 700; letter-spacing: .2em; color: var(--m); margin-bottom: .8rem; display: flex; align-items: center; gap: .7rem; }
.pj-aw { font-size: .56rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; border: 1px solid var(--g); color: var(--g); padding: .18rem .6rem; border-radius: 2px; }
.pj-title { font-family: 'Archivo Black', sans-serif; font-size: clamp(2rem,4.5vw,4.5rem); line-height: .92; color: var(--fg); margin-bottom: .8rem; transition: color .3s; text-transform: uppercase; letter-spacing: -.01em; }
.pj:hover .pj-title { color: var(--g); }
.pj-desc { font-size: clamp(.83rem,1.1vw,.93rem); color: var(--m); line-height: 1.65; flex: 1; margin-bottom: 2rem; }
.pj-cta { display: flex; align-items: center; justify-content: space-between; }
.pj-link { font-size: .64rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--g); border-bottom: 1px solid rgba(52,211,153,.3); padding-bottom: .15rem; transition: border-color .3s; }
.pj:hover .pj-link { border-color: var(--g); }
.pj-arr { font-size: 1.3rem; color: var(--m); transition: transform .35s, color .3s; }
.pj:hover .pj-arr { transform: translate(5px,-5px); color: var(--g); }

/* ─── SKILLS — Thesource style ─── */
#skills { background: var(--bg1); }
.sk-intro { display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; align-items: end; margin-bottom: 4rem; }
.sk-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%,280px),1fr));
  border: 1px solid var(--border); border-radius: 20px; overflow: hidden;
}
.sk-c {
  padding: 2.4rem 2.8rem; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
  position: relative; overflow: hidden; transition: color .4s;
}
.sk-c::before {
  content: ''; position: absolute; inset: 0; background: var(--g);
  transform: translateY(102%); transition: transform .55s cubic-bezier(.19,1,.22,1); z-index: 0;
}
.sk-c:hover::before { transform: none; }
.sk-c > * { position: relative; z-index: 1; }
.sk-c:hover .sk-t, .sk-c:hover .sk-d, .sk-c:hover .sk-ico { color: var(--dark) !important; }
.sk-ico { font-size: 1.6rem; margin-bottom: .9rem; display: block; }
.sk-t { font-family: 'Archivo Black', sans-serif; font-size: 1rem; color: var(--fg); margin-bottom: .45rem; line-height: 1.3; text-transform: uppercase; transition: color .4s; }
.sk-d { font-size: .82rem; color: var(--m); line-height: 1.65; transition: color .4s; }

/* Tools row */
.tools { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 3rem; }
.tool { font-size: .64rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: .35rem .9rem; border-radius: 4px; background: transparent; color: var(--m); border: 1px solid var(--border); transition: all .25s; cursor: default; }
.tool:hover { background: var(--g); color: var(--dark); border-color: var(--g); }

/* Formation */
.edu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%,320px),1fr)); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; margin-top: 3rem; }
.edu-c { padding: 2.5rem 3rem; border-right: 1px solid var(--border); }
.edu-c:last-child { border-right: none; }
.edu-s { font-size: .65rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--g); margin-bottom: .6rem; }
.edu-d { font-family: 'Archivo Black', sans-serif; font-size: clamp(1.2rem,2vw,1.8rem); letter-spacing: -.01em; color: var(--fg); line-height: 1.1; margin-bottom: .6rem; text-transform: uppercase; }
.edu-dt { font-size: .65rem; font-weight: 600; color: var(--m); margin-bottom: .9rem; letter-spacing: .08em; }
.edu-p { font-size: .85rem; color: var(--m); line-height: 1.65; }

/* ─── CONTACT ─── */
#contact { position: relative; overflow: hidden; text-align: center; padding-bottom: 12vh; }
.ct-glow { position: absolute; bottom: -20%; left: 50%; transform: translateX(-50%); width: 80vw; height: 80vw; border-radius: 50%; background: radial-gradient(circle, rgba(52,211,153,.05) 0%, transparent 65%); pointer-events: none; }
.ct-email {

const { useState, useEffect, useRef } = React;

/* ── Reveal ── */
function FU({ children, delay = 0, style = {} }) {
  const ref = useRef(null);
  const [v, setV] = useState(false);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) setV(true); }, { threshold: .08 });
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return (
    <div ref={ref} className={`reveal${v ? ' visible' : ''}`} style={{ transitionDelay: `${delay}s`, ...style }}>
      {children}
    </div>
  );
}

/* ── Nav ── */
function Nav() {
  const [sc, setSc] = useState(false);
  useEffect(() => {
    const fn = () => setSc(window.scrollY > 50);
    window.addEventListener('scroll', fn);
    return () => window.removeEventListener('scroll', fn);
  }, []);
  return null; /* handled in HTML nav */
}

}
