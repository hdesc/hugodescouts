<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Hugo Descouts — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;500;700;800&family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
:root {
  --bg: #050505;
  --bg1: #0a0a0a;
  --bg2: #0f0f0f;
  --fg: #f0ede6;
  --g: #00FF87;
  --g2: #00cc6a;
  --g-glow: rgba(0,255,135,.15);
  --m: rgba(240,237,230,.45);
  --b: rgba(240,237,230,.08);
  --b2: rgba(0,255,135,.2);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; background: var(--bg); }
body { background: var(--bg); color: var(--fg); font-family: 'Syne', sans-serif; overflow-x: hidden; -webkit-font-smoothing: antialiased; cursor: none; }
img { display: block; max-width: 100%; }
button { cursor: none; border: none; background: none; color: inherit; font-family: inherit; }
a { color: inherit; text-decoration: none; cursor: none; }
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--g); border-radius: 2px; }

/* ── CURSOR ── */
#cur { position: fixed; z-index: 9999; pointer-events: none; width: 8px; height: 8px; background: var(--g); border-radius: 50%; transform: translate(-50%,-50%); transition: width .3s, height .3s; mix-blend-mode: difference; }
#cur-r { position: fixed; z-index: 9998; pointer-events: none; width: 38px; height: 38px; border: 1px solid rgba(0,255,135,.4); border-radius: 50%; transform: translate(-50%,-50%); transition: width .4s, height .4s, opacity .3s; }
.hovering #cur { width: 22px; height: 22px; }
.hovering #cur-r { width: 64px; height: 64px; opacity: .5; }

/* ── NOISE ── */
body::before { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 997;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.04'/%3E%3C/svg%3E"); opacity: .6; }

/* ── TICKER ── */
.tk { overflow: hidden; border-top: 1px solid var(--b2); border-bottom: 1px solid var(--b2); background: var(--bg); padding: .75rem 0; }
.tk-t { display: flex; width: max-content; animation: tk 30s linear infinite; }
.tk-t.rev { animation-direction: reverse; animation-duration: 24s; }
@keyframes tk { from { transform: translateX(0); } to { transform: translateX(-50%); } }
.tk-i { font-family: 'DM Mono', monospace; font-size: .7rem; letter-spacing: .2em; text-transform: uppercase; color: var(--m); white-space: nowrap; padding: 0 2rem; }
.tk-i.g { color: var(--g); }

/* ── NAV ── */
#nav { position: fixed; top: 0; left: 0; right: 0; z-index: 500; padding: 1.4rem clamp(1.5rem,4vw,3rem); display: flex; align-items: center; justify-content: space-between; gap: 1rem; transition: background .4s, border-color .4s; }
#nav.sc { background: rgba(5,5,5,.95); backdrop-filter: blur(24px); border-bottom: 1px solid var(--b); }
.n-logo { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; letter-spacing: .08em; color: var(--g); line-height: 1; }
.n-links { display: flex; gap: 2rem; }
.n-links a { font-family: 'DM Mono', monospace; font-size: .65rem; letter-spacing: .2em; text-transform: uppercase; color: var(--m); transition: color .25s; }
.n-links a:hover { color: var(--g); }
.hbg { display: none; font-size: 1.5rem; color: var(--fg); padding: .25rem; }

/* ── MOB MENU ── */
.mob { display: none; position: fixed; inset: 0; background: var(--bg); z-index: 600; flex-direction: column; justify-content: flex-end; padding: clamp(3rem,7vw,5rem); gap: 1.2rem; }
.mob.open { display: flex; }
.mob a { font-family: 'Bebas Neue', sans-serif; font-size: clamp(3rem,10vw,6rem); color: var(--fg); line-height: 1.1; border-bottom: 1px solid var(--b); padding-bottom: .4rem; transition: color .3s; letter-spacing: .02em; }
.mob a:hover { color: var(--g); }
.mob-x { position: absolute; top: 1.8rem; right: 2rem; font-size: 1.8rem; color: var(--m); }

/* ── LAYOUT ── */
.page { position: relative; z-index: 1; }
section { padding: clamp(5rem,10vw,9rem) clamp(1.5rem,5vw,4.5rem); }
.inner { max-width: 1380px; margin: 0 auto; }

/* ── SCROLL REVEAL ── */
.fu { opacity: 0; transform: translateY(2.8rem); transition: opacity .9s ease, transform .9s cubic-bezier(.19,1,.22,1); }
.fu.in { opacity: 1; transform: none; }
.cl { overflow: hidden; display: block; }
.cl-i { display: block; transform: translateY(108%); transition: transform 1.3s cubic-bezier(.19,1,.22,1); }
.cl-i.in { transform: none; }

/* ── TYPE ── */
.bb { font-family: 'Bebas Neue', sans-serif; font-size: clamp(5rem,15vw,17rem); line-height: .88; letter-spacing: .01em; color: var(--fg); display: block; }
.bb-o { font-family: 'Bebas Neue', sans-serif; font-size: clamp(5rem,15vw,17rem); line-height: .88; letter-spacing: .01em; -webkit-text-stroke: 1.5px rgba(240,237,230,.2); color: transparent; display: block; }
.sh { font-family: 'Bebas Neue', sans-serif; font-size: clamp(3rem,9vw,10rem); line-height: .9; letter-spacing: .01em; color: var(--fg); }
.sh-o { -webkit-text-stroke: 1.5px rgba(240,237,230,.18); color: transparent; }
.lbl { font-family: 'DM Mono', monospace; font-size: .65rem; letter-spacing: .3em; text-transform: uppercase; color: var(--g); display: flex; align-items: center; gap: .8rem; margin-bottom: 1.5rem; }
.lbl::before { content: ''; width: 2rem; height: 1px; background: var(--g); flex-shrink: 0; }
hr.dv { height: 1px; border: none; background: linear-gradient(to right, transparent, var(--g), transparent); margin-bottom: clamp(3rem,5vw,5rem); opacity: .25; }
.body-t { font-size: clamp(.95rem,1.4vw,1.1rem); color: var(--m); line-height: 1.85; font-weight: 400; }
.body-t strong { color: var(--fg); font-weight: 700; }

/* ── HERO ── */
#hero { min-height: 100svh; display: flex; flex-direction: column; justify-content: flex-end; padding-top: 8rem; position: relative; overflow: hidden; border-bottom: 1px solid var(--b); }
.h-glow { position: absolute; top: -20%; right: -10%; width: 70vw; height: 70vw; border-radius: 50%; background: radial-gradient(circle, rgba(0,255,135,.05) 0%, transparent 65%); pointer-events: none; animation: pulse-g 8s ease-in-out infinite; }
@keyframes pulse-g { 0%,100% { transform: scale(1); opacity: .6; } 50% { transform: scale(1.1); opacity: 1; } }
.h-grid-bg { position: absolute; inset: 0; pointer-events: none; opacity: .04;
  background-image: linear-gradient(var(--g) 1px, transparent 1px), linear-gradient(90deg, var(--g) 1px, transparent 1px);
  background-size: clamp(40px,5vw,80px) clamp(40px,5vw,80px); }
.h-ov { font-family: 'DM Mono', monospace; font-size: .7rem; letter-spacing: .24em; text-transform: uppercase; color: var(--m); display: flex; align-items: center; gap: .7rem; margin-bottom: 2rem; flex-wrap: wrap; }
.live { width: 8px; height: 8px; border-radius: 50%; background: var(--g); box-shadow: 0 0 10px var(--g); flex-shrink: 0; animation: blink 2s infinite; }
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .15; } }
.h-bottom { display: grid; grid-template-columns: 1fr auto; align-items: flex-end; gap: 2rem; padding-bottom: clamp(3rem,5vw,5rem); margin-top: 2.5rem; }
.s-n { font-family: 'Bebas Neue', sans-serif; font-size: clamp(3rem,6vw,5.5rem); color: var(--g); line-height: 1; }
.s-l { font-family: 'DM Mono', monospace; font-size: .57rem; letter-spacing: .15em; text-transform: uppercase; color: var(--m); margin-top: .3rem; }

/* ── HERMÈS SECTION ── */
#hermes { padding: 0; position: relative; min-height: 100vh; display: flex; align-items: flex-end; overflow: hidden; }
.hm-bg { position: absolute; inset: 0; background: linear-gradient(135deg, #0d0800 0%, #1c1005 35%, #0d0800 100%); }
.hm-img { position: absolute; inset: 0; background-image: url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=1800&q=80&fit=crop&crop=center'); background-size: cover; background-position: center; opacity: .07; mix-blend-mode: luminosity; }
.hm-glow { position: absolute; inset: 0; background: radial-gradient(ellipse 90% 80% at 60% 30%, rgba(201,150,58,.1) 0%, transparent 65%); }
.hm-lines { position: absolute; inset: 0; pointer-events: none; }
.hm-line { position: absolute; top: 0; bottom: 0; width: 1px; background: linear-gradient(to bottom, transparent, rgba(201,150,58,.08), transparent); }
.hm-content { position: relative; z-index: 2; width: 100%; max-width: 1380px; margin: 0 auto; padding: clamp(5rem,9vw,8rem) clamp(1.5rem,5vw,4.5rem); }
.hm-badge { display: inline-flex; align-items: center; gap: .7rem; background: rgba(201,150,58,.1); border: 1px solid rgba(201,150,58,.3); border-radius: 999px; padding: .4rem 1.3rem; font-family: 'DM Mono', monospace; font-size: .63rem; letter-spacing: .2em; text-transform: uppercase; color: #C9963A; margin-bottom: 2.5rem; }
.hm-top { display: flex; align-items: center; gap: 2.5rem; margin-bottom: 2rem; flex-wrap: wrap; }
.hm-logo { width: clamp(90px,10vw,130px); height: clamp(90px,10vw,130px); background: #fff; border-radius: 18px; display: flex; align-items: center; justify-content: center; padding: 14px; box-shadow: 0 0 80px rgba(201,150,58,.22); flex-shrink: 0; overflow: hidden; border: 2px solid rgba(201,150,58,.2); }
.hm-logo img { max-width: 100%; max-height: 100%; object-fit: contain; }
.hm-name { font-family: 'Bebas Neue', sans-serif; font-size: clamp(4rem,12vw,11rem); color: #C9963A; line-height: .9; text-shadow: 0 0 100px rgba(201,150,58,.2); letter-spacing: .02em; }
.hm-role { font-family: 'DM Mono', monospace; font-size: .72rem; letter-spacing: .15em; text-transform: uppercase; color: rgba(201,150,58,.65); margin-bottom: .7rem; }
.hm-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%,400px), 1fr)); gap: 4rem; margin-top: 3rem; align-items: start; }
.hm-ul { list-style: none; display: flex; flex-direction: column; gap: .9rem; margin-bottom: 1.8rem; }
.hm-ul li { font-size: clamp(.88rem,1.2vw,1.02rem); color: rgba(240,237,230,.55); line-height: 1.75; display: flex; gap: 1rem; }
.hm-ul li::before { content: '◆'; color: #C9963A; font-size: .45rem; margin-top: .38rem; flex-shrink: 0; }
.hm-chip { font-family: 'DM Mono', monospace; font-size: .6rem; letter-spacing: .1em; text-transform: uppercase; padding: .32rem .9rem; border-radius: 3px; border: 1px solid rgba(201,150,58,.3); color: #C9963A; display: inline-block; }
.hm-kpi-row { display: flex; gap: clamp(2rem,4vw,4rem); flex-wrap: wrap; padding: 2rem; background: rgba(201,150,58,.05); border: 1px solid rgba(201,150,58,.12); border-radius: 14px; }
.hm-kpi-n { font-family: 'Bebas Neue', sans-serif; font-size: clamp(2.5rem,5vw,4rem); color: #C9963A; line-height: 1; }
.hm-kpi-l { font-family: 'DM Mono', monospace; font-size: .58rem; letter-spacing: .14em; text-transform: uppercase; color: rgba(201,150,58,.55); margin-top: .3rem; max-width: 130px; }

/* ── PHOTO + ABOUT ── */
#about { background: var(--bg1); }
.ab-grid { display: grid; grid-template-columns: clamp(260px, 28vw, 380px) 1fr; gap: clamp(3rem,6vw,7rem); align-items: start; }
.ph-frame { border-radius: 14px; overflow: hidden; aspect-ratio: 3/4; position: relative; border: 1px solid var(--b2); }
.ph-frame img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(15%); }
.ph-frame::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(5,5,5,.6) 0%, transparent 55%); pointer-events: none; }
.ph-cap { position: absolute; bottom: 1.5rem; left: 1.5rem; right: 1.5rem; z-index: 2; }
.ph-name { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; color: #fff; letter-spacing: .03em; line-height: 1; }
.ph-sub { font-family: 'DM Mono', monospace; font-size: .58rem; letter-spacing: .15em; text-transform: uppercase; color: rgba(255,255,255,.45); margin-top: .3rem; }

/* ── PASSIONS ── */
.pp-row { display: grid; grid-template-columns: repeat(3,1fr); border-top: 1px solid var(--b); }
.pp { position: relative; overflow: hidden; aspect-ratio: 2/3; }
.pp img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(85%) brightness(.65); transition: transform .9s cubic-bezier(.19,1,.22,1), filter .7s; display: block; }
.pp:hover img { transform: scale(1.07); filter: grayscale(0%) brightness(.8); }
.pp-ov { position: absolute; inset: 0; background: linear-gradient(to top, rgba(5,5,5,.9) 0%, rgba(5,5,5,.1) 55%, transparent 100%); }
.pp-lbl { position: absolute; bottom: 0; left: 0; right: 0; padding: clamp(1.5rem,3vw,2.5rem); }
.pp-cat { font-family: 'DM Mono', monospace; font-size: .58rem; letter-spacing: .28em; text-transform: uppercase; color: var(--g); margin-bottom: .55rem; }
.pp-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(2rem,5vw,4.5rem); color: #fff; line-height: 1; letter-spacing: .03em; }
.pp-sub { font-family: 'DM Mono', monospace; font-size: .58rem; color: rgba(255,255,255,.38); margin-top: .4rem; letter-spacing: .03em; }
.pp:not(:last-child) { border-right: 1px solid var(--b); }

/* ── XP ── */
.xp-i { border-bottom: 1px solid var(--b); padding: clamp(2rem,4vw,3.5rem) 0; cursor: none; transition: padding .4s; }
.xp-i:first-child { border-top: 1px solid var(--b); }
.xp-i:hover { padding-left: .8rem; }
.xp-r { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: clamp(1.5rem,3vw,3rem); }
.xp-logo { width: clamp(52px,6vw,68px); height: clamp(52px,6vw,68px); background: #fff; border-radius: 10px; display: flex; align-items: center; justify-content: center; padding: 8px; flex-shrink: 0; overflow: hidden; border: 1px solid var(--b); }
.xp-logo img { max-width: 100%; max-height: 100%; object-fit: contain; }
.xp-co { font-family: 'Bebas Neue', sans-serif; font-size: clamp(2rem,5vw,4.5rem); line-height: 1; color: var(--fg); transition: color .3s; letter-spacing: .02em; }
.xp-i:hover .xp-co, .xp-i.open .xp-co { color: var(--g); }
.xp-role { font-size: clamp(.8rem,1.1vw,.95rem); color: var(--m); margin-top: .3rem; }
.xp-bdg { font-family: 'DM Mono', monospace; font-size: .54rem; letter-spacing: .12em; text-transform: uppercase; padding: .18rem .55rem; border-radius: 3px; border: 1px solid; display: inline-block; margin-bottom: .4rem; }
.alt { color: #34d399; border-color: rgba(52,211,153,.3); }
.stage { color: #f59e0b; border-color: rgba(245,158,11,.3); }
.xp-date { font-family: 'DM Mono', monospace; font-size: .62rem; letter-spacing: .12em; color: var(--m); text-transform: uppercase; white-space: nowrap; }
.xp-plus { font-size: 2rem; color: var(--b); transition: transform .4s, color .3s; flex-shrink: 0; line-height: 1; }
.xp-i:hover .xp-plus, .xp-i.open .xp-plus { color: var(--g); }
.xp-i.open .xp-plus { transform: rotate(45deg); }
.xp-body { max-height: 0; overflow: hidden; transition: max-height .6s cubic-bezier(.19,1,.22,1); }
.xp-body.open { max-height: 600px; }
.xp-inn { padding: 2rem 0 .5rem calc(clamp(52px,6vw,68px) + clamp(1.5rem,3vw,3rem)); border-top: 1px solid var(--b); }
.xp-ul { list-style: none; display: flex; flex-direction: column; gap: .8rem; margin-bottom: 1.5rem; }
.xp-ul li { font-size: clamp(.88rem,1.1vw,1rem); color: var(--m); line-height: 1.72; display: flex; gap: 1rem; }
.xp-ul li::before { content: '→'; color: var(--g); flex-shrink: 0; }
.chips { display: flex; flex-wrap: wrap; gap: .5rem; }
.chip { font-family: 'DM Mono', monospace; font-size: .6rem; letter-spacing: .1em; text-transform: uppercase; padding: .3rem .85rem; border-radius: 3px; border: 1px solid var(--b); color: var(--m); }

/* ── PROJECTS ── */
.pj-grid { display: grid; grid-template-columns: repeat(2,1fr); border: 1px solid var(--b); }
.pj { padding: clamp(2rem,4vw,3.5rem); border-right: 1px solid var(--b); border-bottom: 1px solid var(--b); cursor: none; position: relative; overflow: hidden; min-height: clamp(260px,24vw,360px); display: flex; flex-direction: column; justify-content: space-between; transition: background .4s; }
.pj:hover { background: rgba(0,255,135,.03); }
.pj:nth-child(2n) { border-right: none; }
.pj:nth-child(3), .pj:nth-child(4) { border-bottom: none; }
.pj-glow { position: absolute; width: 350px; height: 350px; border-radius: 50%; top: -40%; right: -20%; background: radial-gradient(circle, rgba(0,255,135,.06) 0%, transparent 70%); pointer-events: none; opacity: 0; transition: opacity .4s; }
.pj:hover .pj-glow { opacity: 1; }
.pj-num { font-family: 'DM Mono', monospace; font-size: .65rem; letter-spacing: .2em; color: var(--m); margin-bottom: 1rem; display: flex; align-items: center; gap: .7rem; }
.pj-aw { font-family: 'DM Mono', monospace; font-size: .54rem; letter-spacing: .12em; text-transform: uppercase; border: 1px solid var(--g); color: var(--g); padding: .2rem .6rem; border-radius: 2px; }
.pj-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(2.5rem,5vw,5.5rem); line-height: .92; color: var(--fg); margin-bottom: .8rem; transition: color .3s; letter-spacing: .01em; }
.pj:hover .pj-title { color: var(--g); }
.pj-desc { font-size: clamp(.83rem,1.1vw,.93rem); color: var(--m); line-height: 1.65; flex: 1; margin-bottom: 2rem; }
.pj-cta { display: flex; align-items: center; justify-content: space-between; }
.pj-link { font-family: 'DM Mono', monospace; font-size: .6rem; letter-spacing: .18em; text-transform: uppercase; color: var(--g); border-bottom: 1px solid rgba(0,255,135,.25); padding-bottom: .15rem; transition: border-color .3s; }
.pj-arr { font-size: 1.3rem; color: var(--m); transition: transform .35s, color .3s; }
.pj:hover .pj-arr { transform: translate(5px,-5px); color: var(--g); }

/* ── SKILLS — Thesource grid ── */
#skills { background: var(--bg1); }
.sk-intro { display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; align-items: end; margin-bottom: 4rem; }
.kpi-block { display: flex; flex-direction: column; gap: 0; border: 1px solid var(--b); border-radius: 12px; overflow: hidden; }
.kpi-row { display: flex; align-items: center; gap: 2rem; padding: 1.5rem 2rem; border-bottom: 1px solid var(--b); transition: background .3s; }
.kpi-row:last-child { border-bottom: none; }
.kpi-row:hover { background: rgba(0,255,135,.04); }
.kpi-n { font-family: 'Bebas Neue', sans-serif; font-size: clamp(2.5rem,4.5vw,3.8rem); color: var(--g); line-height: 1; min-width: 120px; letter-spacing: .01em; }
.kpi-l { font-family: 'DM Mono', monospace; font-size: .62rem; letter-spacing: .15em; text-transform: uppercase; color: var(--m); }
.sk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); border-top: 1px solid var(--b); border-left: 1px solid var(--b); }
.sk-c { padding: 2.5rem 2.8rem; border-right: 1px solid var(--b); border-bottom: 1px solid var(--b); position: relative; overflow: hidden; transition: color .4s; }
.sk-c::before { content: ''; position: absolute; inset: 0; background: var(--g); transform: translateY(101%); transition: transform .55s cubic-bezier(.19,1,.22,1); z-index: 0; }
.sk-c:hover::before { transform: none; }
.sk-c > * { position: relative; z-index: 1; }
.sk-c:hover .sk-t, .sk-c:hover .sk-d { color: var(--bg); }
.sk-ico { font-size: 1.5rem; margin-bottom: .9rem; display: block; }
.sk-t { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1rem; color: var(--fg); margin-bottom: .45rem; transition: color .4s; line-height: 1.3; }
.sk-d { font-size: .82rem; color: var(--m); line-height: 1.65; transition: color .4s; }
.tools { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 3rem; }
.tool { font-family: 'DM Mono', monospace; font-size: .62rem; letter-spacing: .08em; padding: .35rem .9rem; border-radius: 3px; background: transparent; color: var(--m); border: 1px solid var(--b); transition: all .25s; cursor: none; }
.tool:hover { background: var(--g); color: var(--bg); border-color: var(--g); }

/* ── FORMATION ── */
.edu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%,320px), 1fr)); border: 1px solid var(--b); border-radius: 12px; overflow: hidden; margin-top: 3rem; }
.edu-c { padding: 2.5rem 3rem; border-right: 1px solid var(--b); }
.edu-c:last-child { border-right: none; }
.edu-s { font-family: 'DM Mono', monospace; font-size: .62rem; letter-spacing: .18em; text-transform: uppercase; color: var(--g); margin-bottom: .6rem; }

const { useState, useEffect, useRef } = React;

/* ── cursor ── */
function Cursor() {
  useEffect(() => {
    const cur = document.getElementById('cur');
    const ring = document.getElementById('cur-r');
    let rx = 0, ry = 0, mx = 0, my = 0;
    const mv = e => { mx = e.clientX; my = e.clientY; cur.style.left = mx+'px'; cur.style.top = my+'px'; };
    let raf;
    const loop = () => { rx += (mx-rx)*.13; ry += (my-ry)*.13; ring.style.left=rx+'px'; ring.style.top=ry+'px'; raf=requestAnimationFrame(loop); };
    window.addEventListener('mousemove', mv);
    const addH = e => { if(e.target.closest('a,button,[data-hover]')) document.body.classList.add('hovering'); };
    const remH = e => { if(e.target.closest('a,button,[data-hover]')) document.body.classList.remove('hovering'); };
    document.addEventListener('mouseover', addH);
    document.addEventListener('mouseout', remH);
    raf = requestAnimationFrame(loop);
    return () => { window.removeEventListener('mousemove', mv); cancelAnimationFrame(raf); document.removeEventListener('mouseover',addH); document.removeEventListener('mouseout',remH); };
  }, []);
  return null;
}

/* ── scroll reveal ── */
function useVis(thr = .07) {
  const ref = useRef(null);
  const [v, setV] = useState(false);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) setV(true); }, { threshold: thr });
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return [ref, v];
}

function FU({ children, delay = 0, style = {} }) {
  const [ref, v] = useVis(.06);
  return <div ref={ref} className={`fu${v?' in':''}`} style={{ transitionDelay:`${delay}s`, ...style }}>{children}</div>;
}

/* ── countup ── */
function CountUp({ to, suffix='', dur=2200 }) {
  const [n, setN] = useState(0);
  const [ref, v] = useVis(.1);
  useEffect(() => {
    if (!v) return;
    let start = null;
    const step = ts => { if (!start) start=ts; const p=Math.min((ts-start)/dur,1); setN(Math.floor(p*to)); if(p<1) requestAnimationFrame(step); else setN(to); };
    requestAnimationFrame(step);
  }, [v, to]);
  return <span ref={ref}>{n.toLocaleString('fr')}{suffix}</span>;
}

<script>
/* ── nav ── */
function oMob(){ document.getElementById('mob').classList.add('open'); document.body.style.overflow='hidden'; }
function cMob(){ document.getElementById('mob').classList.remove('open'); document.body.style.overflow=''; }

/* ── PDF MODAL — persistent via localStorage base64 ── */
const PDF_KEY = 'hd_portfolio_pdfs_v3';

function loadStore() {
  try { return JSON.parse(localStorage.getItem(PDF_KEY)||'{}'); }
  catch(e) { return {}; }
}
function saveStore(s) {
  try { localStorage.setItem(PDF_KEY, JSON.stringify(s)); }
  catch(e) {
    try { localStorage.removeItem(PDF_KEY); localStorage.setItem(PDF_KEY, JSON.stringify(s)); }
    catch(e2) { console.warn('localStorage plein'); }
  }
}
function b64ToObjectUrl(b64) {
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i=0; i<bin.length; i++) arr[i] = bin.charCodeAt(i);
  return URL.createObjectURL(new Blob([arr], {type:'application/pdf'}));
}

let curId = '';
const META = { trempez:'TREMPEZ', tui:"DÉCONNEC'TUI", rose:'ROSE FESTIVAL', edu:'ÉDUCATION NATIONALE' };

function oModal(id, title) {
  curId = id;
  document.getElementById('mTtl').textContent = META[id]||title;
  document.getElementById('pdfNote').style.display = 'none';
  const frame = document.getElementById('pdfFrame');
  const ph = document.getElementById('pdfPh');
  const store = loadStore();
  if (store[id]) {
    try {
      frame.src = b64ToObjectUrl(store[id]);
      frame.style.display = 'block';
      ph.style.display = 'none';
    } catch(e) { frame.style.display='none'; ph.style.display='flex'; }
  } else {
    frame.src=''; frame.style.display='none'; ph.style.display='flex';
    document.getElementById('pdfInp').value='';
  }
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function cModal() {
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow = '';
}

function loadPdf(input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const b64 = e.target.result.split(',')[1];
    const store = loadStore();
    store[curId] = b64;
    saveStore(store);
    const frame = document.getElementById('pdfFrame');
    frame.src = b64ToObjectUrl(b64);
    frame.style.display = 'block';
    document.getElementById('pdfPh').style.display = 'none';
    const note = document.getElementById('pdfNote');
    note.style.display = 'block';
    setTimeout(() => { note.style.display='none'; }, 4000);
  };
  reader.readAsDataURL(file);
}

document.getElementById('modal').addEventListener('click', function(e){ if(e.target===this) cModal(); });
document.addEventListener('keydown', e => { if(e.key==='Escape') cModal(); });
window.oModal = oModal;
</script>
