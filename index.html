<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Hugo Descouts - Et si j'étais votre prochain alternant ?</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700;1,900&family=Cabinet+Grotesk:wght@300;400;500;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  :root {
    --bg: #030303;
    --fg: #ffffff;
    --muted: rgba(255,255,255,0.55);
    --border: rgba(255,255,255,0.08);
    --accent: #ffffff;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; background: var(--bg); }
  body { background: var(--bg); color: var(--fg); font-family: 'Cabinet Grotesk', sans-serif; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); }
  img { display: block; max-width: 100%; }
  button { cursor: pointer; border: none; background: none; color: inherit; font-family: inherit; }
  a { color: inherit; text-decoration: none; }

  /* Bruit de fond discret */
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 999;
  }

  /* Orbes lumineuses très douces */
  .orbs { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .orb { position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.3; }
  .o1 { width: 60vw; height: 60vw; top: -20%; right: -10%; background: radial-gradient(circle, rgba(255,255,255,0.05), transparent 70%); animation: float 20s ease-in-out infinite; }
  .o2 { width: 50vw; height: 50vw; bottom: -10%; left: -10%; background: radial-gradient(circle, rgba(255,255,255,0.03), transparent 70%); animation: float 25s ease-in-out infinite reverse; }
  
  @keyframes float { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-5%,5%)} }
  @keyframes scrollTicker { from{transform:translateX(0)} to{transform:translateX(-50%)} }

  /* Navigation */
  #nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 1.5rem 2.5rem; display: flex; align-items: center; justify-content: space-between; transition: all 0.5s cubic-bezier(0.19,1,0.22,1); }
  #nav.scrolled { background: rgba(3,3,3,0.8); backdrop-filter: blur(20px); padding: 1rem 2.5rem; border-bottom: 1px solid var(--border); }
  .nav-logo { font-family: 'Playfair Display', serif; font-style: italic; font-size: 1.5rem; font-weight: 900; }
  .nav-links { display: flex; gap: 2.5rem; }
  .nav-links a { font-size: 0.85rem; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; transition: color 0.3s; }
  .nav-links a:hover { color: var(--fg); }

  /* Layout de base */
  .page { position: relative; z-index: 1; }
  section { padding: 10vw 4vw; }
  .inner { max-width: 1400px; margin: 0 auto; }
  
  /* Typographie massive agence */
  .huge-text { font-family: 'Cabinet Grotesk', sans-serif; font-weight: 900; font-size: clamp(4rem, 12vw, 14rem); line-height: 0.85; text-transform: uppercase; letter-spacing: -0.04em; margin-bottom: 2rem; }
  .huge-text-stroke { WebkitTextStroke: 2px rgba(255,255,255,0.2); color: transparent; }
  
  .section-title { font-family: 'Cabinet Grotesk', sans-serif; font-weight: 900; font-size: clamp(3rem, 7vw, 7rem); line-height: 0.9; letter-spacing: -0.03em; margin-bottom: 4rem; }
  
  .label-mono { font-family: 'DM Mono', monospace; font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin-bottom: 1.5rem; display: flex; align-items: center; gap: 1rem; }
  .label-mono::before { content: ''; width: 2rem; height: 1px; background: rgba(255,255,255,0.3); }

  /* Éléments interactifs */
  .agency-card { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 24px; transition: all 0.5s cubic-bezier(0.19,1,0.22,1); position: relative; overflow: hidden; }
  .agency-card:hover { background: rgba(255,255,255,0.05); transform: translateY(-10px); border-color: rgba(255,255,255,0.2); }
  
  /* Ticker défilant infini */
  .ticker { overflow: hidden; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 1.5rem 0; background: rgba(255,255,255,0.01); }
  .ticker-track { display: flex; gap: 4rem; width: max-content; animation: scrollTicker 30s linear infinite; }
  .ticker-item { font-family: 'Cabinet Grotesk', sans-serif; font-weight: 800; font-size: 1.5rem; text-transform: uppercase; color: var(--muted); }

  @media(max-width: 768px) { .nav-links { display: none; } }
</style>
</head>
<body>
<div class="orbs"><div class="orb o1"></div><div class="orb o2"></div></div>

<nav id="nav">
  <div class="nav-logo">HD</div>
  <div class="nav-links">
    <a href="#about">Profil</a>
    <a href="#experience">Expériences</a>
    <a href="#projects">Projets</a>
    <a href="#contact">Contact</a>
  </div>
</nav>

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// Composant d'apparition théâtrale (texte masqué qui monte)
function RevealText({ children, delay = 0 }) {
  const ref = useRef(null);
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) setVisible(true); }, { threshold: 0.1 });
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  
  return (
    <div ref={ref} style={{ overflow: 'hidden', display: 'inline-block', width: '100%' }}>
      <div style={{
        transform: visible ? 'translateY(0)' : 'translateY(110%)',
        transition: `transform 1.2s ${delay}s cubic-bezier(0.19, 1, 0.22, 1)`,
        willChange: 'transform'
      }}>
        {children}
      </div>
    </div>
  );
}

// Composant d'apparition globale (fondu vers le haut)
function FadeUp({ children, delay = 0 }) {
  const ref = useRef(null);
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) setVisible(true); }, { threshold: 0.1 });
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  
  return (
    <div ref={ref} style={{
      opacity: visible ? 1 : 0,
      transform: visible ? 'translateY(0)' : 'translateY(3rem)',
      transition: `all 1.2s ${delay}s cubic-bezier(0.19, 1, 0.22, 1)`,
    }}>
      {children}
    </div>
  );
}

function Hero() {
  return (
    <section style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', justifyContent: 'center', paddingTop: '10vh' }}>
      <div className="inner">
        <FadeUp delay={0.1}>
          <div className="label-mono" style={{ color: '#34d399' }}>
            <span style={{ width: 8, height: 8, background: '#34d399', borderRadius: '50%', boxShadow: '0 0 12px #34d399' }}></span>
            Disponible Septembre 2026
          </div>
        </FadeUp>
        
        <RevealText delay={0.2}>
          <div className="huge-text">HUGO</div>
        </RevealText>
        <RevealText delay={0.3}>
          <div className="huge-text" style={{ WebkitTextStroke: '2px rgba(255,255,255,0.2)', color: 'transparent', marginTop: '-3vw' }}>DESCOUTS</div>
        </RevealText>
        
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))', gap: '4rem', marginTop: '5rem' }}>
          <FadeUp delay={0.5}>
            <p style={{ fontSize: '1.25rem', lineHeight: 1.6, color: 'var(--muted)', maxWidth: '500px' }}>
              Stratège et créatif. Futur étudiant en MBA ISCOM. J'apporte une vision audacieuse et une exécution millimétrée pour des campagnes qui marquent les esprits.
            </p>
          </FadeUp>
          <FadeUp delay={0.6}>
            <div style={{ display: 'flex', gap: '3rem' }}>
              <div>
                <div style={{ fontSize: '3rem', fontWeight: 900 }}>3</div>
                <div className="label-mono" style={{ marginTop: '0.5rem' }}>Expériences pro</div>
              </div>
              <div>
                <div style={{ fontSize: '3rem', fontWeight: 900 }}>4</div>
                <div className="label-mono" style={{ marginTop: '0.5rem' }}>Projets publiés</div>
              </div>
            </div>
          </FadeUp>
        </div>
      </div>
    </section>
  );
}

function Ticker() {
  const items = ['Direction Artistique', 'Stratégie', 'Hermès', 'Social Media', 'MBA ISCOM', 'Design', 'Création'];
  return (
    <div className="ticker">
      <div className="ticker-track">
        {[...items, ...items, ...items].map((item, i) => (
          <span key={i} className="ticker-item">{item} <span style={{ color: 'rgba(255,255,255,0.2)', margin: '0 1rem' }}>/</span></span>
        ))}
      </div>
    </div>
  );
}

function AgencyCarousel() {
  const slides = [
    { img: 'https://media.lesechos.com/api/v1/images/view/67adf5173d2c9b436a35c07e/1280x720/0140809604526-web-tete.jpg', title: 'BALLET' },
    { img: 'https://cinedweller.com/wp-content/uploads/2025/03/queer-affiche.jpg.webp', title: 'CINÉMA' },
    { img: 'https://www.radiofrance.fr/pikapi/images/bc7bbc48-c4b2-45e8-a3d3-c7aa8156b4b0/1200x680?webp=false', title: 'MODE' }
  ];
  
  return (
    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))', gap: '2rem', marginTop: '4rem' }}>
      {slides.map((s, i) => (
        <FadeUp key={i} delay={0.2 * i}>
          <div className="agency-card" style={{ height: '500px', cursor: 'pointer' }}>
            <img src={s.img} style={{ width: '100%', height: '100%', objectFit: 'cover', filter: 'grayscale(50%) brightness(0.6)', transition: 'all 0.8s' }} 
                 onMouseOver={e => { e.currentTarget.style.filter = 'grayscale(0%) brightness(1)'; e.currentTarget.style.transform = 'scale(1.05)'; }}
                 onMouseOut={e => { e.currentTarget.style.filter = 'grayscale(50%) brightness(0.6)'; e.currentTarget.style.transform = 'scale(1)'; }}
            />
            <div style={{ position: 'absolute', bottom: '2rem', left: '2rem', pointerEvents: 'none' }}>
              <div className="label-mono">Sensibilité</div>
              <div style={{ fontSize: '2.5rem', fontWeight: 900 }}>{s.title}</div>
            </div>
          </div>
        </FadeUp>
      ))}
    </div>
  );
}

function About() {
  return (
    <section id="about">
      <div className="inner">
        <div className="label-mono">À propos</div>
        <RevealText>
          <h2 className="section-title">
            PROFIL <span className="huge-text-stroke">STRATÉGIQUE</span>
          </h2>
        </RevealText>
        <AgencyCarousel />
      </div>
    </section>
  );
}

function Experience() {
  const exps = [
    { date: 'Sept. 2025', company: 'Hermès', role: 'Communication Interne & IT' },
    { date: '2024 - 2025', company: 'UNPPD', role: 'Chargé de Communication' },
    { date: 'Mai 2024', company: 'Corporate Fiction', role: 'Communication Commerciale' }
  ];

  return (
    <section id="experience">
      <div className="inner">
        <div className="label-mono">Parcours</div>
        <RevealText>
          <h2 className="section-title">
            EXPÉRIENCES <span className="huge-text-stroke">CLÉS</span>
          </h2>
        </RevealText>
        
        <div style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>
          {exps.map((exp, i) => (
            <FadeUp key={i} delay={i * 0.1}>
              <div className="agency-card" style={{ padding: '3rem', display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '2rem' }}>
                <div style={{ flex: 1 }}>
                  <div className="label-mono" style={{ marginBottom: '0.5rem' }}>{exp.date}</div>
                  <div style={{ fontSize: '2.5rem', fontWeight: 800, marginBottom: '0.5rem' }}>{exp.company}</div>
                  <div style={{ color: 'var(--muted)', fontSize: '1.2rem' }}>{exp.role}</div>
                </div>
                <div style={{ width: '50px', height: '50px', borderRadius: '50%', border: '1px solid rgba(255,255,255,0.2)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '1.5rem' }}>
                  ↗
                </div>
              </div>
            </FadeUp>
          ))}
        </div>
      </div>
    </section>
  );
}

function Contact() {
  return (
    <section id="contact" style={{ textAlign: 'center', paddingBottom: '10vh' }}>
      <div className="inner">
        <FadeUp>
          <div style={{ fontFamily: "'Playfair Display', serif", fontStyle: 'italic', fontWeight: 900, fontSize: 'clamp(5rem, 15vw, 12rem)', lineHeight: 0.9, marginBottom: '3rem' }}>
            Disons<br/>Bonjour.
          </div>
        </FadeUp>
        <FadeUp delay={0.2}>
          <a href="mailto:hugo.descouts@outlook.fr" style={{ display: 'inline-block', background: '#ffffff', color: '#000000', padding: '1.5rem 3rem', borderRadius: '999px', fontSize: '1.2rem', fontWeight: 800, textTransform: 'uppercase', letterSpacing: '0.1em' }}>
            Me contacter
          </a>
        </FadeUp>
      </div>
    </section>
  );
}

function App() {
  useEffect(() => {
    window.addEventListener('scroll', () => {
      document.getElementById('nav')?.classList.toggle('scrolled', window.scrollY > 50);
    });
  }, []);

  return (
    <div className="page">
      <Hero />
      <Ticker />
      <About />
      <Experience />
      <Contact />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
